<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PITI 核算台账 — Mesa / Tempe / Phoenix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232E;
    --ink-soft:#2A3A48;
    --paper:#FBF8F2;
    --paper-dim:#F1ECE1;
    --line:#D8D0BE;
    --brass:#B08947;
    --brass-dim:#DCC79A;
    --approve:#3F6E52;
    --approve-bg:#E7EFE7;
    --reject:#9C3B2E;
    --reject-bg:#F4E7E3;
    --slate:#5B6B7A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--brass-dim);}
  :focus-visible{outline:2px solid var(--brass); outline-offset:2px;}

  .wrap{max-width:980px; margin:0 auto; padding:28px 20px 80px;}

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    border-bottom:3px solid var(--ink); padding-bottom:16px; margin-bottom:8px;
    flex-wrap:wrap;
  }
  .brand-mark{
    width:46px; height:46px; border:2px solid var(--ink); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px;
    letter-spacing:-0.5px; flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  h1{
    font-family:'Roboto Slab',serif; font-weight:800; font-size:26px;
    margin:0; letter-spacing:-0.3px; line-height:1.1;
  }
  .sub{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--slate);
    margin-top:4px; text-transform:uppercase; letter-spacing:1px;
  }
  .rule-note{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink);
    background:var(--paper-dim); border:1px solid var(--line); border-radius:3px;
    padding:8px 12px; white-space:nowrap;
  }
  .rule-note b{color:var(--brass);}

  /* ---------- Assumptions bar ---------- */
  .assume{
    margin-top:22px; border:1px solid var(--line); border-radius:6px; background:#fff;
  }
  .assume summary{
    cursor:pointer; padding:12px 16px; font-family:'IBM Plex Mono',monospace;
    font-size:12px; text-transform:uppercase; letter-spacing:1.5px; color:var(--slate);
    display:flex; align-items:center; justify-content:space-between;
  }
  .assume[open] summary{border-bottom:1px solid var(--line);}
  .assume-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;
    padding:16px;
  }
  .field label{
    display:block; font-size:11px; color:var(--slate); text-transform:uppercase;
    letter-spacing:0.6px; margin-bottom:5px; font-family:'IBM Plex Mono',monospace;
  }
  .field input, .field select, .field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:4px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; background:var(--paper);
    color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brass);}

  /* ---------- Add button ---------- */
  .add-row{margin:22px 0; display:flex; gap:10px; flex-wrap:wrap;}
  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    border-radius:5px; border:1px solid var(--ink); padding:10px 16px;
    cursor:pointer; background:var(--ink); color:var(--paper);
    transition:transform .08s ease;
  }
  button:active{transform:scale(0.98);}
  button.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  button.small{padding:6px 11px; font-size:12px;}
  button.brass{background:var(--brass); border-color:var(--brass); color:#fff;}
  button:disabled{opacity:0.5; cursor:not-allowed;}

  /* ---------- Form panel ---------- */
  .panel{
    border:1px solid var(--ink); border-radius:6px; background:#fff; padding:20px;
    margin-bottom:22px;
  }
  .panel h3{
    font-family:'Roboto Slab',serif; font-size:17px; margin:0 0 14px;
  }
  .grid2{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px;}
  .field.full{grid-column:1/-1;}
  .panel-actions{display:flex; gap:10px; margin-top:16px; justify-content:flex-end;}
  .comp-row{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
  .comp-row input{flex:1;}

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center; padding:60px 20px; color:var(--slate); border:1px dashed var(--line);
    border-radius:6px; font-family:'IBM Plex Mono',monospace; font-size:13px;
  }

  /* ---------- Property card ---------- */
  .card{
    border:1px solid var(--line); border-radius:6px; background:#fff; margin-bottom:16px;
    overflow:hidden; position:relative;
  }
  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
    padding:16px 18px 12px; border-bottom:1px solid var(--paper-dim); flex-wrap:wrap;
  }
  .card-addr{font-family:'Roboto Slab',serif; font-weight:600; font-size:17px;}
  .card-city{font-size:12px; color:var(--slate); margin-top:2px;}
  .stamp{
    display:inline-block; border:3px double currentColor; border-radius:4px;
    padding:5px 14px; transform:rotate(-6deg); font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase; letter-spacing:2px; font-weight:700; font-size:12px;
    white-space:nowrap;
  }
  .stamp.approve{color:var(--approve); background:var(--approve-bg);}
  .stamp.reject{color:var(--reject); background:var(--reject-bg);}

  .card-body{padding:14px 18px 18px; display:grid; grid-template-columns:1.1fr 1fr; gap:20px;}
  @media (max-width:640px){ .card-body{grid-template-columns:1fr;} }

  .ledger-table{width:100%; border-collapse:collapse; font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .ledger-table tr{border-bottom:1px dotted var(--line);}
  .ledger-table tr:last-child{border-bottom:none;}
  .ledger-table td{padding:5px 0;}
  .ledger-table td:last-child{text-align:right; font-weight:600;}
  .ledger-table tr.total td{border-top:1.5px solid var(--ink); padding-top:8px; font-weight:700;}

  .margin-box{
    border-radius:5px; padding:12px 14px; font-family:'IBM Plex Mono',monospace;
  }
  .margin-box.approve{background:var(--approve-bg); color:var(--approve);}
  .margin-box.reject{background:var(--reject-bg); color:var(--reject);}
  .margin-box .big{font-size:20px; font-weight:700;}
  .margin-box .cap{font-size:11px; text-transform:uppercase; letter-spacing:1px; opacity:0.85;}

  .rent-block{margin-top:12px;}
  .rent-block h4{
    font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--slate);
    margin:0 0 8px; font-family:'IBM Plex Mono',monospace;
  }
  .tier-pills{display:flex; gap:6px; flex-wrap:wrap;}
  .pill{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:4px 9px;
    border:1px solid var(--line); border-radius:20px; cursor:pointer; background:#fff;
  }
  .pill.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  .ai-box{
    margin-top:10px; border:1px dashed var(--brass); border-radius:5px; padding:10px 12px;
    font-size:12.5px; background:#FFFDF8;
  }
  .ai-box .verdict{font-weight:700; color:var(--brass); font-family:'IBM Plex Mono',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.5px;}
  .ai-box p{margin:6px 0 0; line-height:1.5; color:var(--ink-soft);}

  .card-footer{
    padding:10px 18px; background:var(--paper-dim); display:flex; gap:8px;
    justify-content:flex-end; flex-wrap:wrap; border-top:1px solid var(--line);
  }
  .thumb{max-width:120px; max-height:80px; border-radius:4px; border:1px solid var(--line); margin-top:8px; display:block;}
  .file-label{
    display:inline-block; font-size:12px; border:1px solid var(--line); border-radius:4px;
    padding:6px 10px; cursor:pointer; font-family:'IBM Plex Mono',monospace;
  }
  .file-label:hover{border-color:var(--brass);}
  input[type=file]{display:none;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:6px;
    font-size:13px; font-family:'IBM Plex Mono',monospace; opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:50;
  }
  .toast.show{opacity:1;}
  .spinner{
    display:inline-block; width:12px; height:12px; border:2px solid var(--brass-dim);
    border-top-color:var(--brass); border-radius:50%; animation:spin .7s linear infinite;
    vertical-align:middle; margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){ .spinner{animation:none;} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">P·I<br>T·I</div>
      <div>
        <h1>PITI 核算台账</h1>
        <div class="sub">Mesa · Tempe · Phoenix, AZ — 投资房源审核</div>
      </div>
    </div>
    <div class="rule-note">通过标准：租金 × <b>0.7</b> ≥ PITI</div>
  </header>

  <details class="assume">
    <summary><span>默认假设参数（新增房源时自动带入，单套内仍可修改）</span><span>展开 ▾</span></summary>
    <div class="assume-grid">
      <div class="field"><label>首付比例 %</label><input type="number" id="a-down" value="20" step="1"></div>
      <div class="field"><label>贷款年利率 %</label><input type="number" id="a-rate" value="7.0" step="0.05"></div>
      <div class="field"><label>贷款年限（年）</label><input type="number" id="a-term" value="30" step="1"></div>
      <div class="field"><label>房产税率 %/年</label><input type="number" id="a-tax" value="0.65" step="0.01"></div>
      <div class="field"><label>保险 %/年（按房价）</label><input type="number" id="a-ins" value="0.35" step="0.01"></div>
      <div class="field"><label>HOA 月费 $</label><input type="number" id="a-hoa" value="0" step="5"></div>
    </div>
  </details>

  <div class="add-row">
    <button id="btn-add" class="brass">+ 新增房源</button>
    <button id="btn-copy" class="ghost">复制达标房源清单（可粘贴到邮件）</button>
  </div>

  <div id="form-slot"></div>
  <div id="list"></div>
  <div id="empty-state" class="empty" style="display:none;">还没有房源记录 — 点击"新增房源"开始录入</div>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  let properties = [];
  let assumptions = {down:20, rate:7.0, term:30, tax:0.65, ins:0.35, hoa:0};
  let editingId = null;

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2400);
  }
  function uid(){ return 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
  function fmt(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
  function fmt2(n){ return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  // ---------- persistence ----------
  async function loadAll(){
    try{
      const a = await window.storage.get('assumptions', false);
      if(a && a.value) assumptions = JSON.parse(a.value);
    }catch(e){ /* not set yet */ }
    try{
      const p = await window.storage.get('properties', false);
      if(p && p.value) properties = JSON.parse(p.value);
    }catch(e){ /* not set yet */ }
    hydrateAssumptionFields();
    render();
  }
  async function saveAssumptions(){
    try{ await window.storage.set('assumptions', JSON.stringify(assumptions), false); }
    catch(e){ console.error(e); toast('假设参数保存失败'); }
  }
  async function saveProperties(){
    try{ await window.storage.set('properties', JSON.stringify(properties), false); }
    catch(e){ console.error(e); toast('保存失败，请重试'); }
  }
  function hydrateAssumptionFields(){
    $('a-down').value = assumptions.down;
    $('a-rate').value = assumptions.rate;
    $('a-term').value = assumptions.term;
    $('a-tax').value = assumptions.tax;
    $('a-ins').value = assumptions.ins;
    $('a-hoa').value = assumptions.hoa;
  }
  ['a-down','a-rate','a-term','a-tax','a-ins','a-hoa'].forEach(id=>{
    $(id).addEventListener('change', ()=>{
      assumptions = {
        down:+$('a-down').value, rate:+$('a-rate').value, term:+$('a-term').value,
        tax:+$('a-tax').value, ins:+$('a-ins').value, hoa:+$('a-hoa').value
      };
      saveAssumptions();
    });
  });

  // ---------- calculations ----------
  function calcPITI(p){
    const loan = p.price * (1 - p.down/100);
    const r = p.rate/100/12;
    const n = p.term*12;
    let pi;
    if(r === 0) pi = loan/n;
    else pi = loan * r / (1 - Math.pow(1+r, -n));
    const tax = p.price * p.tax/100 / 12;
    const ins = p.price * p.ins/100 / 12;
    const hoa = p.hoa || 0;
    return {pi, tax, ins, hoa, total: pi+tax+ins+hoa};
  }
  function estimateRent(p){
    const comps = (p.comps||[]).filter(c=>c>0);
    const base = comps.length ? comps.reduce((a,b)=>a+b,0)/comps.length : (p.manualRent||0);
    const adj = base * (1 + (p.rentAdjustPct||0)/100);
    return {base, adj};
  }

  // ---------- render list ----------
  function render(){
    const list = $('list');
    list.innerHTML = '';
    $('empty-state').style.display = properties.length ? 'none':'block';
    properties.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(p=>{
      list.appendChild(renderCard(p));
    });
  }

  function renderCard(p){
    const piti = calcPITI(p);
    const rent = estimateRent(p);
    const threshold = rent.adj * 0.7;
    const pass = threshold >= piti.total && rent.adj > 0;
    const margin = threshold - piti.total;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-addr">${escapeHtml(p.address || '（未填地址）')}</div>
          <div class="card-city">${escapeHtml(p.city||'Mesa')}, AZ &nbsp;·&nbsp; 售价 ${fmt(p.price)} &nbsp;·&nbsp; 首付 ${p.down}%${p.beds?` &nbsp;·&nbsp; ${p.beds}bed/${p.baths||'-'}bath`:''}${p.sqft?` &nbsp;·&nbsp; ${p.sqft} sqft`:''}${p.units&&p.units>1?` &nbsp;·&nbsp; ${p.units} units`:''}</div>
          ${p.notes?`<div class="card-city" style="margin-top:4px; font-style:italic;">${escapeHtml(p.notes)}</div>`:''}
        </div>
        <div class="stamp ${pass?'approve':'reject'}">${pass?'达标 / Approved':'未达标 / Rejected'}</div>
      </div>

      <div class="card-body">
        <div>
          <table class="ledger-table">
            <tr><td>本金+利息 (P&amp;I)</td><td>${fmt(piti.pi)}</td></tr>
            <tr><td>房产税 /月</td><td>${fmt(piti.tax)}</td></tr>
            <tr><td>保险 /月</td><td>${fmt(piti.ins)}</td></tr>
            <tr><td>HOA /月</td><td>${fmt(piti.hoa)}</td></tr>
            <tr class="total"><td>PITI 合计</td><td>${fmt(piti.total)}</td></tr>
          </table>
        </div>
        <div>
          <div class="rent-block">
            <h4>租金估算</h4>
            <div style="font-family:'IBM Plex Mono',monospace; font-size:13px;">
              comps 均值 ${fmt(rent.base)} → 装修调整后 <b>${fmt(rent.adj)}</b>
            </div>
            <div class="tier-pills" style="margin-top:8px;">
              <span class="pill ${p.tier==='old'?'active':''}" data-tier="old">老旧 −5%</span>
              <span class="pill ${p.tier==='updated'?'active':''}" data-tier="updated">一般/翻新中 +0%</span>
              <span class="pill ${p.tier==='new'?'active':''}" data-tier="new">全新装修 +12%</span>
            </div>
          </div>
          <div class="margin-box ${pass?'approve':'reject'}" style="margin-top:12px;">
            <div class="cap">租金×0.7 − PITI</div>
            <div class="big">${margin>=0?'+':''}${fmt(margin)} /月</div>
          </div>
          <div style="margin-top:10px;">
            <label class="file-label">📷 上传照片 → AI 评估装修
              <input type="file" accept="image/*" class="ai-file">
            </label>
            <div class="ai-result"></div>
          </div>
        </div>
      </div>
      <div class="card-footer">
        <button class="ghost small btn-edit">编辑</button>
        <button class="ghost small btn-del">删除</button>
      </div>
    `;

    // tier pills
    card.querySelectorAll('.pill').forEach(pill=>{
      pill.addEventListener('click', ()=>{
        p.tier = pill.dataset.tier;
        p.rentAdjustPct = p.tier==='old' ? -5 : p.tier==='new' ? 12 : 0;
        saveProperties(); render();
      });
    });
    card.querySelector('.btn-del').addEventListener('click', ()=>{
      if(confirm('确定删除这套房源记录？')){
        properties = properties.filter(x=>x.id!==p.id);
        saveProperties(); render();
      }
    });
    card.querySelector('.btn-edit').addEventListener('click', ()=>openForm(p));
    card.querySelector('.ai-file').addEventListener('change', (e)=>handleAIAnalyze(e, p, card));

    return card;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- AI photo analysis ----------
  async function handleAIAnalyze(e, p, card){
    const file = e.target.files[0];
    if(!file) return;
    const resultBox = card.querySelector('.ai-result');
    resultBox.innerHTML = `<div class="ai-box"><span class="spinner"></span>正在分析装修状况…</div>`;

    try{
      const base64 = await fileToBase64(file);
      const mediaType = file.type || 'image/jpeg';

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-4-6',
          max_tokens:400,
          messages:[{
            role:'user',
            content:[
              {type:'image', source:{type:'base64', media_type:mediaType, data:base64}},
              {type:'text', text:'你在评估一套出租投资房的室内/外观照片，用于估算合理租金水平。请只返回一个JSON对象，不要有任何其他文字、不要markdown代码块，格式严格为：{"tier":"old"|"updated"|"new","reason":"一句中文说明，20字以内","suggested_adjust_pct":数字}。tier含义：old=明显老旧未翻新，updated=状态一般或部分翻新，new=近期全新装修/地板家具新净。suggested_adjust_pct是相对市场均价租金的建议调整百分比，old约-10到-3，updated约-2到3，new约8到18。'}
            ]
          }]
        })
      });
      const data = await response.json();
      const textBlock = (data.content||[]).find(b=>b.type==='text');
      if(!textBlock) throw new Error('no text in response');
      const clean = textBlock.text.replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(clean);

      const tierLabel = {old:'老旧', updated:'一般/翻新中', new:'全新装修'}[parsed.tier] || parsed.tier;
      resultBox.innerHTML = `
        <div class="ai-box">
          <span class="verdict">AI 判断：${tierLabel}（建议租金调整 ${parsed.suggested_adjust_pct>0?'+':''}${parsed.suggested_adjust_pct}%）</span>
          <p>${escapeHtml(parsed.reason||'')}</p>
          <button class="ghost small btn-apply-ai" style="margin-top:8px;">应用此建议</button>
        </div>`;
      resultBox.querySelector('.btn-apply-ai').addEventListener('click', ()=>{
        p.tier = parsed.tier;
        p.rentAdjustPct = parsed.suggested_adjust_pct;
        saveProperties(); render();
        toast('已应用 AI 建议');
      });
    }catch(err){
      console.error(err);
      resultBox.innerHTML = `<div class="ai-box" style="border-color:var(--reject);"><span class="verdict" style="color:var(--reject);">分析失败</span><p>请重试，或手动在上方选择装修档位。</p></div>`;
    }
  }
  function fileToBase64(file){
    return new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result.split(',')[1]);
      r.onerror = ()=> reject(new Error('read failed'));
      r.readAsDataURL(file);
    });
  }

  // ---------- add / edit form ----------
  function openForm(existing){
    editingId = existing ? existing.id : null;
    const p = existing || {
      id: uid(), address:'', city:'Mesa', price:300000,
      down:assumptions.down, rate:assumptions.rate, term:assumptions.term,
      tax:assumptions.tax, ins:assumptions.ins, hoa:assumptions.hoa,
      comps:[null,null,null], manualRent:0, tier:'updated', rentAdjustPct:0,
      beds:'', baths:'', sqft:'', units:1, notes:'',
      createdAt: Date.now()
    };
    const slot = $('form-slot');
    slot.innerHTML = `
      <div class="panel">
        <h3>${existing?'编辑房源':'新增房源'}</h3>
        ${existing?'':`
        <div style="margin-bottom:16px; border:1px dashed var(--brass); border-radius:5px; padding:10px 12px; background:#FFFDF8;">
          <button type="button" class="ghost small" id="btn-toggle-import">粘贴导入（把我在聊天里给你的数据块粘进来）</button>
          <div id="import-slot" style="display:none; margin-top:10px;">
            <textarea id="f-import" rows="6" style="width:100%; font-family:'IBM Plex Mono',monospace; font-size:12px;" placeholder='粘贴 JSON，例如 {"address":"123 E Main St","city":"Mesa","price":320000,"beds":3,"baths":2,"sqft":1450,"units":1,"comps":[1600,1550],"notes":"..."}'></textarea>
            <button type="button" class="brass small" id="btn-do-import" style="margin-top:8px;">解析并填充</button>
          </div>
        </div>`}
        <div class="grid2">
          <div class="field full"><label>地址</label><input id="f-address" value="${existing?escapeHtml(p.address):''}" placeholder="例如 123 E Main St"></div>
          <div class="field"><label>城市</label>
            <select id="f-city">
              <option ${p.city==='Mesa'?'selected':''}>Mesa</option>
              <option ${p.city==='Tempe'?'selected':''}>Tempe</option>
              <option ${p.city==='Phoenix'?'selected':''}>Phoenix</option>
            </select>
          </div>
          <div class="field"><label>售价 $</label><input type="number" id="f-price" value="${p.price}" step="1000"></div>
          <div class="field"><label>Bedrooms</label><input type="number" id="f-beds" value="${p.beds}" step="1"></div>
          <div class="field"><label>Bathrooms</label><input type="number" id="f-baths" value="${p.baths}" step="0.5"></div>
          <div class="field"><label>面积 sqft</label><input type="number" id="f-sqft" value="${p.sqft}" step="10"></div>
          <div class="field"><label>Unit 数（几户）</label><input type="number" id="f-units" value="${p.units||1}" step="1"></div>
          <div class="field"><label>首付 %</label><input type="number" id="f-down" value="${p.down}" step="1"></div>
          <div class="field"><label>年利率 %</label><input type="number" id="f-rate" value="${p.rate}" step="0.05"></div>
          <div class="field"><label>贷款年限</label><input type="number" id="f-term" value="${p.term}" step="1"></div>
          <div class="field"><label>房产税 %/年</label><input type="number" id="f-tax" value="${p.tax}" step="0.01"></div>
          <div class="field"><label>保险 %/年</label><input type="number" id="f-ins" value="${p.ins}" step="0.01"></div>
          <div class="field"><label>HOA 月费 $</label><input type="number" id="f-hoa" value="${p.hoa}" step="5"></div>
          <div class="field full"><label>备注（描述摘要 / 照片判断理由等）</label><textarea id="f-notes" rows="2">${existing?escapeHtml(p.notes||''):''}</textarea></div>
        </div>
        <div style="margin-top:16px;">
          <label style="display:block; font-size:11px; color:var(--slate); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:8px; font-family:'IBM Plex Mono',monospace;">附近可比出租房租金（最近成交/在租，越多越准）</label>
          <div id="comp-rows"></div>
          <button type="button" class="ghost small" id="btn-add-comp">+ 添加一条 comp</button>
        </div>
        <div class="grid2" style="margin-top:16px;">
          <div class="field"><label>若无 comps，手动填市场租金 $/月</label><input type="number" id="f-manual-rent" value="${p.manualRent||0}" step="10"></div>
        </div>
        <div class="panel-actions">
          <button class="ghost" id="btn-cancel">取消</button>
          <button class="brass" id="btn-save">保存</button>
        </div>
      </div>
    `;
    const compRows = $('comp-rows');
    function addCompRow(val){
      const row = document.createElement('div');
      row.className = 'comp-row';
      row.innerHTML = `<input type="number" placeholder="租金 $/月" value="${val!=null?val:''}" step="10"><button type="button" class="ghost small">删除</button>`;
      row.querySelector('button').addEventListener('click', ()=>row.remove());
      compRows.appendChild(row);
    }
    (p.comps && p.comps.length ? p.comps : [null,null]).forEach(addCompRow);
    $('btn-add-comp').addEventListener('click', ()=>addCompRow(null));
    $('btn-cancel').addEventListener('click', ()=>{ slot.innerHTML=''; editingId=null; });

    if(!existing){
      $('btn-toggle-import').addEventListener('click', ()=>{
        const box = $('import-slot');
        box.style.display = box.style.display==='none' ? 'block' : 'none';
      });
      $('btn-do-import').addEventListener('click', ()=>{
        let obj;
        try{ obj = JSON.parse($('f-import').value); }
        catch(e){ toast('JSON 格式解析失败，检查一下有没有多余的逗号或引号'); return; }
        if(obj.address) $('f-address').value = obj.address;
        if(obj.city) $('f-city').value = obj.city;
        if(obj.price) $('f-price').value = obj.price;
        if(obj.beds!=null) $('f-beds').value = obj.beds;
        if(obj.baths!=null) $('f-baths').value = obj.baths;
        if(obj.sqft!=null) $('f-sqft').value = obj.sqft;
        if(obj.units!=null) $('f-units').value = obj.units;
        if(obj.notes) $('f-notes').value = obj.notes;
        if(Array.isArray(obj.comps) && obj.comps.length){
          compRows.innerHTML = '';
          obj.comps.forEach(addCompRow);
        }
        toast('已填充，检查一下再保存');
      });
    }

    $('btn-save').addEventListener('click', ()=>{
      const comps = Array.from(compRows.querySelectorAll('input')).map(i=>+i.value).filter(v=>v>0);
      const np = {
        id:p.id, createdAt:p.createdAt,
        address:$('f-address').value.trim(), city:$('f-city').value,
        price:+$('f-price').value, down:+$('f-down').value, rate:+$('f-rate').value,
        term:+$('f-term').value, tax:+$('f-tax').value, ins:+$('f-ins').value, hoa:+$('f-hoa').value,
        beds:$('f-beds').value?+$('f-beds').value:'', baths:$('f-baths').value?+$('f-baths').value:'',
        sqft:$('f-sqft').value?+$('f-sqft').value:'', units:+$('f-units').value||1,
        notes:$('f-notes').value.trim(),
        comps, manualRent:+$('f-manual-rent').value,
        tier:p.tier||'updated', rentAdjustPct:p.rentAdjustPct||0
      };
      if(!np.address){ toast('请填写地址'); return; }
      const idx = properties.findIndex(x=>x.id===np.id);
      if(idx>=0) properties[idx]=np; else properties.push(np);
      saveProperties();
      slot.innerHTML=''; editingId=null;
      render();
      toast('已保存');
    });
  }

  $('btn-add').addEventListener('click', ()=>openForm(null));

  $('btn-copy').addEventListener('click', ()=>{
    const passing = properties.filter(p=>{
      const piti = calcPITI(p); const rent = estimateRent(p);
      return rent.adj*0.7 >= piti.total && rent.adj>0;
    });
    if(!passing.length){ toast('目前没有达标房源'); return; }
    const lines = passing.map(p=>{
      const piti = calcPITI(p); const rent = estimateRent(p);
      return `${p.address}, ${p.city} AZ | 售价 ${fmt(p.price)} | PITI ${fmt(piti.total)}/mo | 估算租金 ${fmt(rent.adj)}/mo | 净余 ${fmt(rent.adj*0.7-piti.total)}/mo`;
    });
    const text = `达标投资房源（租金×0.7 ≥ PITI）\n\n` + lines.join('\n');
    navigator.clipboard.writeText(text).then(()=>toast('已复制到剪贴板，可粘贴发邮件')).catch(()=>toast('复制失败，请手动选取文本'));
  });

  loadAll();
})();
</script>
</body>
</html>
