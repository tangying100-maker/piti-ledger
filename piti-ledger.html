<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PITI 核算台账 — Mesa / Tempe / Phoenix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F172A;
    --ink-soft:#475569;
    --paper:#F8FAFC;
    --paper-dim:#EEF2F7;
    --surface:#FFFFFF;
    --line:#E1E7EF;
    --accent:#0891B2;
    --accent-dim:#06B6D4;
    --accent-bg:#ECFEFF;
    --approve:#059669;
    --approve-bg:#ECFDF5;
    --reject:#DC2626;
    --reject-bg:#FEF2F2;
    --slate:#64748B;
    --card-shadow:0 1px 2px rgba(15,23,42,0.04), 0 1px 3px rgba(15,23,42,0.06);
    --card-shadow-hover:0 4px 14px rgba(15,23,42,0.08), 0 0 0 1px rgba(8,145,178,0.15);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(rgba(8,145,178,0.045) 1px, transparent 1px) 0 0/40px 40px,
      linear-gradient(90deg, rgba(8,145,178,0.045) 1px, transparent 1px) 0 0/40px 40px,
      #F8FAFC;
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--accent-dim); color:#fff;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

  .wrap{max-width:1040px; margin:0 auto; padding:24px 20px 80px;}

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    padding-bottom:20px; margin-bottom:20px; flex-wrap:wrap;
    border-bottom:2px solid var(--line);
  }
  .brand-mark{
    width:46px; height:46px; border:2px solid var(--accent); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:11px;
    letter-spacing:-0.5px; flex-shrink:0; color:var(--accent);
    background:var(--accent-bg);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  h1{
    font-family:'Roboto Slab',serif; font-weight:800; font-size:26px;
    margin:0; letter-spacing:-0.3px; line-height:1.1;
    background:linear-gradient(135deg, var(--ink), var(--accent) 70%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .sub{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--slate);
    margin-top:4px; text-transform:uppercase; letter-spacing:1px;
  }
  .rule-note{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink);
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:8px 14px; white-space:nowrap; box-shadow:var(--card-shadow);
  }
  .rule-note b{color:var(--accent);}

  /* ---------- Assumptions bar ---------- */
  .assume{
    margin-top:22px; border:1px solid var(--line); border-radius:10px; background:var(--surface);
    box-shadow:var(--card-shadow);
  }
  .assume summary{
    cursor:pointer; padding:12px 16px; font-family:'IBM Plex Mono',monospace;
    font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--slate);
    display:flex; align-items:center; justify-content:space-between;
  }
  .assume[open] summary{border-bottom:1px solid var(--line);}
  .assume-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:14px;
    padding:16px;
  }
  .field label{
    display:block; font-size:10.5px; color:var(--slate); text-transform:uppercase;
    letter-spacing:0.6px; margin-bottom:5px; font-family:'IBM Plex Mono',monospace;
  }
  .field input, .field select, .field textarea{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; background:var(--paper-dim);
    color:var(--ink); transition:border-color .15s,box-shadow .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    border-color:var(--accent); box-shadow:0 0 0 3px rgba(8,145,178,0.12);
    background:var(--surface); outline:none;
  }
  .field select option{background:var(--paper-dim); color:var(--ink);}

  /* ---------- Add button ---------- */
  .add-row{margin:22px 0; display:flex; gap:10px; flex-wrap:wrap;}
  button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    border-radius:7px; border:1px solid var(--line); padding:10px 16px;
    cursor:pointer; background:var(--surface); color:var(--ink);
    transition:transform .08s ease,box-shadow .15s,border-color .15s;
  }
  button:hover{box-shadow:var(--card-shadow-hover); border-color:var(--accent);}
  button:active{transform:scale(0.98);}
  button.ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  button.ghost:hover{background:var(--paper-dim);}
  button.small{padding:6px 11px; font-size:12px; border-radius:5px;}
  button.brass{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700;
    box-shadow:0 1px 4px rgba(8,145,178,0.35);}
  button.brass:hover{background:var(--accent-dim); box-shadow:0 2px 8px rgba(8,145,178,0.45);}
  button:disabled{opacity:0.4; cursor:not-allowed; box-shadow:none;}

  /* ---------- Form panel ---------- */
  .panel{
    border:1px solid var(--line); border-radius:12px; background:var(--surface); padding:22px;
    margin-bottom:22px; box-shadow:var(--card-shadow);
  }
  .panel h3{
    font-family:'Roboto Slab',serif; font-size:17px; margin:0 0 16px;
    color:var(--ink);
  }
  .grid2{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px;}
  .field.full{grid-column:1/-1;}
  .panel-actions{display:flex; gap:10px; margin-top:18px; justify-content:flex-end;}
  .comp-row{display:flex; gap:8px; margin-bottom:8px; align-items:center;}
  .comp-row input{flex:1;}

  /* ---------- Unit layout editor ---------- */
  .unit-layout-section{
    margin-top:14px; padding:14px; border:1px solid var(--line); border-radius:8px;
    background:var(--paper-dim);
  }
  .unit-layout-section h4{
    font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--accent);
    margin:0 0 10px; font-family:'IBM Plex Mono',monospace;
  }
  .unit-layout-row{
    display:flex; gap:8px; margin-bottom:8px; align-items:center; flex-wrap:wrap;
  }
  .unit-layout-row input{width:64px;}
  .unit-layout-row .ul-count{width:52px;}
  .unit-layout-row .ul-pct{width:58px;}
  .unit-layout-row .ul-label{
    font-size:11px; color:var(--slate); font-family:'IBM Plex Mono',monospace;
    white-space:nowrap;
  }
  .unit-validation{
    margin-top:8px; font-size:11px; font-family:'IBM Plex Mono',monospace;
  }
  .unit-validation.match{color:var(--approve);}
  .unit-validation.mismatch{color:var(--reject);}
  .ul-tier-pills{display:inline-flex; gap:4px;}
  .pill.tiny{font-size:9.5px; padding:2px 7px;}

  /* ---------- Date header ---------- */
  .date-header{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent-dim);
    text-transform:uppercase; letter-spacing:1px; margin:20px 0 12px;
    padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .date-header:first-child{margin-top:0;}

  /* ---------- Empty state ---------- */
  .empty{
    text-align:center; padding:60px 20px; color:var(--slate);
    border:1px dashed var(--line); border-radius:10px;
    font-family:'IBM Plex Mono',monospace; font-size:13px;
    background:var(--surface);
  }

  /* ---------- Property card ---------- */
  .card{
    border:1px solid var(--line); border-radius:12px; background:var(--surface);
    margin-bottom:16px; overflow:hidden; position:relative;
    box-shadow:var(--card-shadow); transition:box-shadow .2s,border-color .2s;
  }
  .card:hover{box-shadow:var(--card-shadow-hover); border-color:rgba(8,145,178,0.3);}
  .card-top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:14px;
    padding:16px 20px 12px; border-bottom:1px solid var(--paper-dim); flex-wrap:wrap;
  }
  .card-addr{font-family:'Roboto Slab',serif; font-weight:600; font-size:17px; color:var(--ink);}
  .card-city{font-size:12px; color:var(--slate); margin-top:2px;}
  .property-badge{
    display:inline-block; font-size:10px; padding:2px 7px; border-radius:10px;
    font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.5px;
    font-weight:600; vertical-align:middle; margin-left:6px;
  }
  .property-badge.mf{background:var(--accent-bg); color:var(--accent); border:1px solid var(--accent-dim);}
  .property-badge.sfh{background:rgba(96,165,250,0.1); color:#60A5FA; border:1px solid rgba(96,165,250,0.35);}
  .stamp{
    display:inline-block; border:3px double currentColor; border-radius:6px;
    padding:5px 14px; transform:rotate(-5deg); font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase; letter-spacing:2px; font-weight:700; font-size:11px;
    white-space:nowrap;
  }
  .stamp.approve{color:var(--approve); background:var(--approve-bg);}
  .stamp.reject{color:var(--reject); background:var(--reject-bg);}

  .card-body{padding:14px 20px 18px; display:grid; grid-template-columns:1.1fr 1fr; gap:20px;}
  @media (max-width:640px){ .card-body{grid-template-columns:1fr;} }

  .ledger-table{width:100%; border-collapse:collapse; font-family:'IBM Plex Mono',monospace; font-size:13px;}
  .ledger-table tr{border-bottom:1px dotted var(--line);}
  .ledger-table tr:last-child{border-bottom:none;}
  .ledger-table td{padding:5px 0;}
  .ledger-table td:last-child{text-align:right; font-weight:600;}
  .ledger-table tr.total td{border-top:1.5px solid var(--accent); padding-top:8px; font-weight:700;}

  .margin-box{
    border-radius:8px; padding:12px 14px; font-family:'IBM Plex Mono',monospace;
    border:1px solid transparent;
  }
  .margin-box.approve{background:var(--approve-bg); color:var(--approve); border-color:rgba(5,150,105,0.2);}
  .margin-box.reject{background:var(--reject-bg); color:var(--reject); border-color:rgba(220,38,38,0.2);}
  .margin-box .big{font-size:20px; font-weight:700;}
  .margin-box .cap{font-size:11px; text-transform:uppercase; letter-spacing:1px; opacity:0.85;}

  .rent-block{margin-top:12px;}
  .rent-block h4{
    font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--slate);
    margin:0 0 8px; font-family:'IBM Plex Mono',monospace;
  }
  .tier-pills{display:flex; gap:6px; flex-wrap:wrap;}
  .pill{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:4px 9px;
    border:1px solid var(--line); border-radius:20px; cursor:pointer; background:var(--paper-dim);
    color:var(--ink-soft);
    transition:all .15s;
  }
  .pill:hover{border-color:var(--accent); color:var(--ink);}
  .pill.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}

  /* Unit breakdown on card */
  .unit-breakdown{
    margin-top:12px; border:1px solid var(--line); border-radius:8px; overflow:hidden;
  }
  .unit-breakdown .ub-header{
    background:var(--accent-bg); padding:8px 12px; font-size:10.5px;
    text-transform:uppercase; letter-spacing:1px; color:var(--accent);
    font-family:'IBM Plex Mono',monospace; font-weight:600;
  }
  .unit-breakdown .ub-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 12px; border-bottom:1px solid var(--paper-dim);
    font-family:'IBM Plex Mono',monospace; font-size:12.5px;
  }
  .unit-breakdown .ub-row:last-child{border-bottom:none;}
  .unit-breakdown .ub-row .ub-type{
    font-weight:600; white-space:nowrap;
  }
  .unit-breakdown .ub-row .ub-rent{color:var(--ink-soft); white-space:nowrap;}
  .unit-breakdown .ub-total{
    padding:8px 12px; font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    font-weight:700; text-align:right; border-top:1px solid var(--line);
    background:var(--paper-dim);
  }

  .ai-box{
    margin-top:10px; border:1px dashed var(--accent); border-radius:8px;
    padding:10px 12px; font-size:12.5px; background:var(--accent-bg);
  }
  .ai-box .verdict{font-weight:700; color:var(--accent); font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.5px;}
  .ai-box p{margin:6px 0 0; line-height:1.5; color:var(--ink-soft);}

  .card-footer{
    padding:10px 20px; background:var(--paper-dim); display:flex; gap:8px;
    justify-content:flex-end; flex-wrap:wrap; border-top:1px solid var(--line);
  }
  .thumb{max-width:120px; max-height:80px; border-radius:6px; border:1px solid var(--line); margin-top:8px; display:block;}
  .file-label{
    display:inline-block; font-size:11.5px; border:1px solid var(--line); border-radius:5px;
    padding:6px 10px; cursor:pointer; font-family:'IBM Plex Mono',monospace;
    transition:border-color .15s;
  }
  .file-label:hover{border-color:var(--accent);}
  input[type=file]{display:none;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 20px; border-radius:8px;
    font-size:13px; font-family:'IBM Plex Mono',monospace; opacity:0; pointer-events:none;
    transition:opacity .25s ease; z-index:50;
    border-top:2px solid var(--accent); box-shadow:0 4px 16px rgba(15,23,42,0.25);
  }
  .toast.show{opacity:1;}
  .spinner{
    display:inline-block; width:12px; height:12px; border:2px solid var(--accent-dim);
    border-top-color:var(--accent); border-radius:50%; animation:spin .7s linear infinite;
    vertical-align:middle; margin-right:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion:reduce){ .spinner{animation:none;} }

  /* ---------- Zillow paste tabs ---------- */
  .zillow-tabs{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap;}
  .zillow-tab{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:6px 12px;
    border:1px solid var(--line); border-radius:5px; cursor:pointer; background:var(--paper-dim);
    color:var(--slate); text-transform:uppercase; letter-spacing:0.5px;
    transition:all .15s;
  }
  .zillow-tab:hover{color:var(--accent); border-color:var(--accent);}
  .zillow-tab.active{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600;}

  /* ---------- Image preview grid (form) ---------- */
  .img-preview-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:5px;
    margin-top:10px; max-height:180px; overflow-y:auto;
  }
  .img-preview-grid img{
    width:100%; height:54px; object-fit:cover; border-radius:5px; border:1px solid var(--line);
    cursor:pointer; transition:transform .1s;
  }
  .img-preview-grid img:hover{transform:scale(1.08); border-color:var(--accent);}

  /* ---------- Card image gallery ---------- */
  .card-images{
    display:flex; gap:5px; overflow-x:auto; margin-top:10px; padding-bottom:4px;
  }
  .card-images img{
    height:56px; width:84px; object-fit:cover; border-radius:5px; border:1px solid var(--line);
    flex-shrink:0; cursor:pointer;
  }
  .card-images img:hover{border-color:var(--accent);}
  .ai-batch-box{
    margin-top:10px; border:1px dashed var(--accent); border-radius:8px;
    padding:10px 12px; font-size:12.5px; background:var(--accent-bg);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">P·I<br>T·I</div>
      <div>
        <h1>PITI 核算台账</h1>
        <div class="sub">Mesa · Tempe · Phoenix, AZ — 投资房源审核</div>
      </div>
    </div>
    <div class="rule-note">通过标准：租金 × <span id="ratio-display" style="cursor:pointer; border-bottom:2px dashed var(--accent); padding:0 4px;" title="点击切换覆盖率阈值"><b>0.7</b></span> ≥ PITI<div style="margin-top:6px; display:flex; gap:4px; flex-wrap:wrap;" id="ratio-pills"><span class="pill tiny ratio-set" data-r="0.7" style="background:var(--accent);color:#fff;">0.70</span><span class="pill tiny ratio-set" data-r="0.75">0.75</span><span class="pill tiny ratio-set" data-r="0.8">0.80</span><input type="number" id="ratio-custom" placeholder="自定义" min="0.1" max="2" step="0.01" style="width:62px; height:22px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; padding:0 5px; border:1px solid var(--border); border-radius:4px; background:var(--card); color:var(--ink); outline:none;" title="自定义覆盖率阈值"></div></div>
  </header>

  <details class="assume">
    <summary><span>默认假设参数（新增房源时自动带入，单套内仍可修改）</span><span>展开 ▾</span></summary>
    <div class="assume-grid">
      <div class="field"><label>首付比例 %</label>
        <input type="number" id="a-down" value="25" step="1">
        <div class="tier-pills" style="margin-top:5px;">
          <span class="pill tiny down-quickset" data-val="20">20%</span>
          <span class="pill tiny down-quickset" data-val="25">25%</span>
        </div>
      </div>
      <div class="field"><label>贷款年利率 %</label><input type="number" id="a-rate" value="7.0" step="0.05"></div>
      <div class="field"><label>贷款年限（年）</label><input type="number" id="a-term" value="30" step="1"></div>
      <div class="field"><label>房产税率 %/年</label><input type="number" id="a-tax" value="0.65" step="0.01"></div>
      <div class="field"><label>保险 %/年（按房价）</label><input type="number" id="a-ins" value="0.35" step="0.01"></div>
      <div class="field"><label>HOA 月费 $</label><input type="number" id="a-hoa" value="0" step="5"></div>
      <div class="field"><label>RentCast API Key</label><input type="password" id="a-rentcast-key" placeholder="用于 Zillow 链接自动填充" autocomplete="off"></div>
      <div class="field"><label>Anthropic API Key</label><input type="password" id="a-anthropic-key" placeholder="用于照片装修分析（付费）" autocomplete="off"></div>
      <div class="field"><label>Google Gemini API Key（免费）</label><input type="password" id="a-gemini-key" placeholder="免费替代方案，见 aistudio.google.com" autocomplete="off"></div>
    </div>
  </details>

  <div class="add-row">
    <button id="btn-add" class="brass">+ 新增房源</button>
    <button id="btn-copy" class="ghost">复制达标房源清单（可粘贴到邮件）</button>
  </div>

  <div id="form-slot"></div>
  <div id="list"></div>
  <div id="empty-state" class="empty" style="display:none;">还没有房源记录 — 点击"新增房源"开始录入</div>

</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  // Zillow Observed Rent Index (ZORI), All Homes Plus Multifamily, smoothed, $/month.
  // Free public research data (files.zillowstatic.com), not scraped listings.
  // Source: https://www.zillow.com/research/data/ -> Rentals -> ZIP Codes. Snapshot 2026-06-30.
  const ZORI_ASOF = '2026-06-30';
  const ZORI_BASELINE = {
    '85201':1326,'85202':1393,'85203':1353,'85204':1430,'85205':1753,'85206':1626,'85207':2267,'85208':1943,'85209':1775,'85210':1453,'85212':2204,'85213':1669,'85215':2345,
    '85003':1725,'85004':1616,'85006':1501,'85007':1375,'85008':1418,'85009':1182,'85012':1553,'85013':1516,'85014':1439,'85015':1247,'85016':1698,'85017':1215,'85018':1616,'85019':1441,'85020':1430,'85021':1220,'85022':1384,'85023':1308,'85024':1847,'85027':1449,'85028':2566,'85029':1234,'85031':1025,'85032':1639,'85033':1403,'85034':1392,'85035':1354,'85037':1736,'85040':1802,'85041':2207,'85042':1691,'85043':1970,'85044':1540,'85045':2901,'85048':1822,'85050':2574,'85051':1275,'85053':1252,'85054':1957,'85083':2693,'85085':1732,'85310':2274,'85339':2133,
    '85281':1687,'85282':1584,'85283':1569,'85284':2769,'85288':1872
  };
  // Rentometer Pro bed-count multipliers, split by property type (house vs
  // apartment/condo/townhouse), pooled across all 6 paid Rentometer Pro
  // reports (Jul 2026: 536 N Hall & 719 N Cherry & 545 W Ivyglen in Mesa,
  // Phoenix 85008, Tempe 85281 & 85283) using each report's per-listing
  // "Bldg Type" column — ~120 listings total. Pooled city-wide rather than
  // per-ZIP: per-ZIP×type×bed cells are too sparse to be reliable (e.g. a
  // single ZIP might have only 2-3 real 4BR house listings), and an earlier
  // per-ZIP attempt silently fell back to the 2BR multiplier for any bed
  // count a ZIP's apartment table didn't cover -- i.e. switching between
  // "House"/"Apartment" for a 3-4BR property changed nothing.
  // House curve (n=5/7/27/30 for 1/2/3/4BR): real 3-4BR rentals in this
  // market are overwhelmingly single-family houses, so this curve has good
  // sample sizes throughout.
  // Apartment curve: 1-2BR are real per-type medians (n=25/24). 3-4BR
  // "apartment" listings are essentially nonexistent in the data (one real
  // 3BR apartment data point total, at a ratio close to the house curve
  // anyway) -- not enough to support an independent curve, so 3-4BR
  // apartment borrows the house curve's shape rather than guessing or
  // flatlining at the 2BR rate.
  const RENT_MULT_HOUSE = {1:0.71, 2:1.00, 3:1.29, 4:1.50};
  const RENT_MULT_APARTMENT = {1:0.85, 2:1.00, 3:1.29, 4:1.50};
  // Compatibility alias for code still referencing old name.
  const ZORI_BED_MULTIPLIER = RENT_MULT_APARTMENT;
  // Heuristic, not data-backed: extra bathrooms beyond 1 nudge rent up a bit.
  const ZORI_BATH_ADJUST_PER_EXTRA = 0.04;

  // Get bed multiplier for a given property type (house vs apartment).
  function getBedMult(zip, propType){
    const type = (propType === 'multifamily' || propType === 'apartment') ? 'apartment' : 'house';
    return type === 'apartment' ? RENT_MULT_APARTMENT : RENT_MULT_HOUSE;
  }
  let properties = [];
  let assumptions = {down:25, rate:7.0, term:30, tax:0.65, ins:0.35, hoa:0, rentcastKey:'', anthropicKey:'', geminiKey:'', coverageRatio:0.7};
  let editingId = null;
  let coverageRatio = 0.7;

  function toast(msg){
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2400);
  }
  function uid(){ return 'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
  // Zillow serves each real photo as several resolution/format variants
  // sharing one base filename (e.g. ".../fp/<hash>-cc_ft_1536.jpg" and
  // ".../fp/<hash>-cc_ft_576.webp" are the SAME photo). Collapse by that
  // base filename and keep the variant with the largest size code so the
  // gallery shows one entry per real photo, at its best available quality.
  function dedupePhotoUrls(urls){
    const sizeSuffix = u => { const m = u.split('?')[0].match(/-([a-zA-Z0-9_]+)\.(jpe?g|png|webp)$/i); return m ? m[1] : ''; };
    const baseKey = u => u.split('?')[0].replace(/-[a-zA-Z0-9_]+\.(jpe?g|png|webp)$/i, '');
    const sizeScore = u => { const n = sizeSuffix(u).match(/\d+/g); return n ? Math.max(...n.map(Number)) : 0; };
    const bestByKey = new Map();
    for(const u of urls){
      const key = baseKey(u);
      const prev = bestByKey.get(key);
      if(!prev || sizeScore(u) > sizeScore(prev)) bestByKey.set(key, u);
    }
    return [...bestByKey.values()];
  }
  function fmt(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
  function fmt2(n){ return n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  // ---------- persistence ----------
  async function loadAll(){
    try{
      const a = localStorage.getItem('piti-assumptions');
      if(a) assumptions = JSON.parse(a);
    }catch(e){ /* not set yet */ }
    coverageRatio = assumptions.coverageRatio || 0.7;
    try{
      const p = localStorage.getItem('piti-properties');
      if(p) properties = JSON.parse(p);
    }catch(e){ /* not set yet */ }
    // One-time cleanup: properties saved before the photo-dedup fix can have
    // duplicate resolution/format variants baked into their stored imageUrls.
    // Re-run the same dedup here so already-saved listings get fixed too,
    // without her having to re-paste and re-parse each one.
    let photosChanged = false;
    for(const prop of properties){
      if(!prop.imageUrls || !prop.imageUrls.length) continue;
      const deduped = dedupePhotoUrls(prop.imageUrls);
      if(deduped.length !== prop.imageUrls.length){
        prop.imageUrls = deduped;
        photosChanged = true;
      }
    }
    if(photosChanged) saveProperties();
    hydrateAssumptionFields();
    render();
  }

  // ---------- Zillow link -> RentCast auto-fill ----------
  const ZILLOW_CITIES = ['Mesa','Tempe','Phoenix'];
  function parseZillowAddress(url){
    const m = url.match(/\/homedetails\/([^\/]+)\/\d+_zpid/i);
    if(!m) return null;
    const slug = decodeURIComponent(m[1]);
    const zipMatch = slug.match(/(\d{5})$/);
    const zip = zipMatch ? zipMatch[1] : '';
    let cityFound = null, streetPart = slug;
    for(const city of ZILLOW_CITIES){
      const re = new RegExp('-' + city + '-[A-Z]{2}-\\d{5}$', 'i');
      const cm = slug.match(re);
      if(cm){ cityFound = city; streetPart = slug.slice(0, cm.index); break; }
    }
    if(!cityFound) return null;
    const street = streetPart.replace(/-/g, ' ').trim();
    return {street, city: cityFound, zip};
  }

  // ---------- Zillow page HTML parser ----------
  // Turn [{beds,baths,count}] groups into one row per physical unit (count=1
  // each) — every unit gets its own row since each has its own tenant tenure
  // and condition, which independently affects its own rent adjustment.
  function explodeUnitGroups(groups){
    const out = [];
    for(const g of groups){
      for(let i=0;i<(g.count||1);i++) out.push({beds:g.beds, baths:g.baths, count:1});
    }
    return out;
  }

  // Parses pasted page-source HTML to extract every field we need:
  // address, price, beds, baths, sqft, units, tax, per-unit rents,
  // total rent, and all photo URLs — using multiple strategies.
  function parseZillowHtml(html){
    const r = {
      address:null, city:null, zip:null, state:null,
      price:null, beds:null, baths:null, sqft:null, units:null,
      yearBuilt:null, lotSize:null, homeType:null, propertyType:null,
      taxAnnual:null, taxAssessed:null,
      rentZestimate:null, unitRents:[], totalRent:null,
      imageUrls:[], description:null,
      unitLayouts:[]  // [{beds, baths, count}] — parsed from Zillow data
    };

    // --- Strategy 1: __NEXT_DATA__ JSON blob ---
    let nd = null;
    const ndMatch = html.match(/<script[^>]*id=["']__NEXT_DATA__["'][^>]*>([\s\S]*?)<\/script>/i);
    if(ndMatch){ try{ nd = JSON.parse(ndMatch[1]); }catch(e){ /* malformed */ } }

    if(nd){
      const gdp = nd?.props?.pageProps?.gdp || nd?.props?.pageProps?.cachePayload?.gdp;
      if(gdp){
        const b = gdp.building || {};
        r.beds = b.bedrooms ?? r.beds;
        r.baths = b.bathrooms ?? b.bathsFull ?? r.baths;
        r.sqft = b.livingArea ?? r.sqft;
        r.yearBuilt = b.yearBuilt ?? r.yearBuilt;
        r.lotSize = b.lotSize ?? r.lotSize;
        r.homeType = b.homeType ?? r.homeType;

        // Address
        const a = gdp.address || b.address;
        if(a){
          r.address = a.streetAddress || a.streetAddressTop || r.address;
          r.city = a.city || r.city;
          r.zip = a.zipcode || a.zip || r.zip;
          r.state = a.state || r.state;
        }

        // Price
        r.price = gdp.price ?? b.price ?? r.price;
        r.rentZestimate = b.rentZestimate ?? gdp.rentZestimate ?? r.rentZestimate;

        // Tax history (most recent entry)
        if(Array.isArray(gdp.taxHistory) && gdp.taxHistory.length){
          const latest = gdp.taxHistory[0];
          r.taxAnnual = latest.taxPaid ?? r.taxAnnual;
          r.taxAssessed = latest.taxAssessedValue ?? r.taxAssessed;
        }
        // resoFacts fallback
        if(gdp.resoFacts){
          r.taxAnnual = r.taxAnnual ?? gdp.resoFacts.taxAnnualAmount ?? null;
          r.taxAssessed = r.taxAssessed ?? gdp.resoFacts.assessedValue ?? null;
        }

        // Photos — Zillow's actual field name/nesting for this varies (has
        // changed over time and probably varies by listing type), so try a
        // wide net of known shapes per photo rather than one fixed path.
        if(Array.isArray(gdp.photos)){
          r.imageUrls = gdp.photos.map(ph => {
            if(typeof ph === 'string') return ph;
            const jpeg = ph.mixedSources?.jpeg || ph.mixedSources?.webp;
            const bestSized = Array.isArray(jpeg) ? jpeg[jpeg.length-1]?.url : null;
            return ph.url || ph.mixedUrl || ph.captionedUrl || bestSized
              || ph.hiResImageLink || ph.highResUrl || ph.url1024 || ph.url768 || null;
          }).filter(Boolean);
        }

        // Multifamily units + rents + unit layouts
        if(Array.isArray(gdp.units) && gdp.units.length){
          r.units = gdp.units.length;
          // Prefer actual listed/current rent over Zillow's own algorithmic
          // zestimate guess — real numbers should win over an estimate.
          r.unitRents = gdp.units
            .map(u => u.rent || u.zestimate || u.rentZestimate || null)
            .filter(v => v != null);
          if(r.unitRents.length){
            r.totalRent = r.unitRents.reduce((s,v)=>s+v, 0);
          }
          // One row PER REAL UNIT (not grouped) — even units with identical
          // bed/bath counts get their own row, because each physical unit has
          // its own tenant tenure / condition and so its own rent adjustment.
          r.unitLayouts = gdp.units
            .map(u => ({
              beds: u.bedrooms ?? u.beds ?? null,
              baths: u.bathrooms ?? u.bathsFull ?? u.baths ?? null
            }))
            .filter(lu => lu.beds != null || lu.baths != null)
            .map(lu => ({beds:lu.beds, baths:lu.baths, count:1}));
        }

        // Detect propertyType from homeType
        if(r.homeType){
          const ht = String(r.homeType).toLowerCase().replace(/[_-]/g,'');
          if(/multifamily|multiple|multi/.test(ht)) r.propertyType = 'multifamily';
          else if(/duplex/.test(ht)) r.propertyType = 'multifamily';
          else if(/triplex/.test(ht)) r.propertyType = 'multifamily';
          else if(/fourplex|quad/.test(ht)) r.propertyType = 'multifamily';
          else if(/five/.test(ht)) r.propertyType = 'multifamily';
          else if(/condo|apartment|townhouse/.test(ht)) r.propertyType = 'multifamily';
          else if(/singlefamily|single/.test(ht)) r.propertyType = 'single_family';
        }
        // Fallback: if units > 1, assume multifamily
        if(!r.propertyType && r.units && r.units > 1) r.propertyType = 'multifamily';
        if(!r.propertyType) r.propertyType = 'single_family';

        // If we got unit layouts, auto-verify against total beds/baths
        if(r.unitLayouts.length && r.beds != null && r.baths != null){
          const sumBeds = r.unitLayouts.reduce((s,l)=>s+(l.beds||0)*(l.count||1),0);
          const sumBaths = r.unitLayouts.reduce((s,l)=>s+(l.baths||0)*(l.count||1),0);
          if(sumBeds !== r.beds || sumBaths !== r.baths){
            // Mismatch — keep the total, but flag it
            r._bedVerify = {total:r.beds, fromLayouts:sumBeds, match:false};
            r._bathVerify = {total:r.baths, fromLayouts:sumBaths, match:false};
          }
        }

        // Description
        r.description = gdp.descriptionText || b.descriptionText || r.description;
      }
    }

    // --- Strategy 2: JSON-LD blocks ---
    const ldMatches = html.match(/<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi);
    if(ldMatches){
      ldMatches.forEach(m => {
        const inner = m.replace(/<script[^>]*>/i,'').replace(/<\/script>/i,'');
        try{
          const d = JSON.parse(inner);
          if(d.image){
            const imgs = Array.isArray(d.image) ? d.image : [d.image];
            imgs.forEach(u => { if(typeof u === 'string' && !r.imageUrls.includes(u)) r.imageUrls.push(u); });
          }
          if(d.offers?.price && !r.price) r.price = +d.offers.price;
          if(d.name && !r.address){
            const parts = d.name.split(',');
            if(parts.length >= 3) r.address = parts[0].trim();
          }
          if(d.description && !r.description) r.description = d.description;
          const ldAddr = d.address || d.offers?.itemOffered?.address;
          if(ldAddr && !r.zip) r.zip = ldAddr.postalCode || r.zip;
        }catch(e){ /* skip */ }
      });
    }

    // --- Zip fallback: regex on raw HTML (doesn't depend on Strategy 1/2) ---
    // Very reliable for this app since it's AZ-only: "..., AZ 85203" or "AZ, 85203".
    if(!r.zip){
      const zm = html.match(/\bAZ\b[,\s]*(\d{5})\b/) || html.match(/"zipcode"\s*:\s*"?(\d{5})"?/i) || html.match(/"postalCode"\s*:\s*"?(\d{5})"?/i);
      if(zm) r.zip = zm[1];
    }

    // --- Search text for description-based detection below ---
    // Strategy 4 (duplex/triplex + unit-layout text parsing) needs text to
    // search for keywords like "triplex". Zillow's page structure varies a lot
    // between listings, and the __NEXT_DATA__ descriptionText we might have
    // grabbed in Strategy 1 is not guaranteed to be the field that actually
    // mentions "triplex"/unit breakdown — sometimes that text lives elsewhere
    // on the page (a different JSON field, a facts panel, etc). Rather than
    // trusting only the first source found, concatenate every source so a
    // keyword scan below has the best chance of finding it wherever it is:
    // the JSON descriptionText, the meta description tag, AND the whole
    // visible page text with scripts/styles/tags stripped.
    const metaM = html.match(/<meta[^>]*name=["']description["'][^>]*content="([^"]*)"/i)
               || html.match(/<meta[^>]*name=["']description["'][^>]*content='([^']*)'/i);
    const wholePageText = html.replace(/<script[\s\S]*?<\/script>/gi, ' ')
                               .replace(/<style[\s\S]*?<\/style>/gi, ' ')
                               .replace(/<[^>]+>/g, ' ')
                               .replace(/&amp;/g,'&').replace(/&nbsp;/g,' ').replace(/&#39;/g,"'").replace(/&rsquo;/g,"'")
                               .replace(/\s+/g,' ')
                               .slice(0, 60000); // cap for performance
    const searchText = [r.description, metaM && metaM[1], wholePageText].filter(Boolean).join('\n\n');
    if(!r.description && searchText) r.description = (metaM && metaM[1]) || wholePageText.slice(0, 2000);

    // --- Strategy 3: regex fallbacks ---
    // Images from zillowstatic CDN — always run this and merge with whatever
    // Strategy 1's structured extraction found (union, deduped), rather than
    // only as a fallback when Strategy 1 found nothing. Zillow's photos JSON
    // shape isn't guaranteed and a field-mapping miss there (wrong field name,
    // all photos collapsing to one placeholder) would otherwise silently give
    // just 1 duplicated image with no way to recover the rest.
    {
      const imgRe = /https?:\/\/[^"'\s]*zillowstatic[^"'\s]*/gi;
      // Raw HTML can contain the same URL JSON-escaped inside an embedded
      // <script> blob (e.g. "https:\/\/photos.zillowstatic.com\/fp\/..."),
      // since this scan runs on the unparsed page text, not JSON.parse'd
      // data. A stray backslash breaks the URL (browser can't load it —
      // shows as a broken/missing thumbnail), so strip escape backslashes;
      // real URLs never legitimately contain one.
      const found = (html.match(imgRe) || []).map(u => u.replace(/\\/g, ''));
      const isLikelyPhoto = u => !/icon|logo|sprite|avatar|badge|placeholder/i.test(u);
      r.imageUrls = [...new Set([...r.imageUrls, ...found])].filter(isLikelyPhoto);
    }

    if(r.price == null){
      const m = html.match(/\$(\d[\d,]*)\s*(?:\/mo|\/month)?/);
      if(m) r.price = +(m[1].replace(/,/g,''));
    }
    if(r.beds == null){
      const m = html.match(/(\d+)\s*(?:bd|bed(?:room)?s?)\b/i);
      if(m) r.beds = +m[1];
    }
    if(r.baths == null){
      const m = html.match(/(\d+(?:\.\d+)?)\s*(?:ba|bath(?:room)?s?)\b/i);
      if(m) r.baths = +m[1];
    }
    if(r.sqft == null){
      const m = html.match(/(\d[\d,]*)\s*(?:sqft|sq\.?\s*ft|square\s*feet)\b/i);
      if(m) r.sqft = +(m[1].replace(/,/g,''));
    }

    // NOTE: There used to be a fallback here that regex-matched ANY "$X/mo" string
    // anywhere in the page (ads, mortgage calculators, unrelated "similar homes"
    // widgets, other listings' rent zestimates). That's exactly what was producing
    // inaccurate comps — it has no way to tell "this property's rent" from noise
    // elsewhere on the page. Removed. Real per-unit rents now come only from
    // Strategy 1's structured gdp.units data (Zillow's own JSON, reliable) or
    // explicit description-text parsing below. Everything else falls through to
    // the calibrated ZORI model, which is more consistently accurate than noise.
    // Single rent zestimate fallback
    if(!r.totalRent && r.rentZestimate){
      r.totalRent = r.rentZestimate;
      r.unitRents = [r.rentZestimate];
    }

    // --- Strategy 4: multifamily detection from description text ---
    // Look for keywords like "duplex", "triplex", "4-plex", "five units" etc.,
    // then try to figure out the actual unit-by-unit bed/bath mix — including
    // MIXED mixes (e.g. "one 3bed/2bath owner's unit plus two 2bed/1bath units",
    // which is how listings usually describe a 7bed/4bath triplex).
    if(!r.propertyType || !r.unitLayouts.length){
      const desc = (searchText || '').toLowerCase();
      // Detect unit count from keywords
      let detectedUnits = null;
      const mfPatterns = [
        ['fourplex', 4], ['four-plex', 4], ['4-plex', 4], ['quadplex', 4], ['quadruplex', 4],
        ['4 unit', 4], ['four unit', 4], ['4 family', 4],
        ['triplex', 3], ['tri-plex', 3], ['3-plex', 3],
        ['3 unit', 3], ['three unit', 3], ['3 family', 3], ['triple', 3],
        ['duplex', 2], ['du-plex', 2], ['2-plex', 2],
        ['2 unit', 2], ['two unit', 2], ['2 family', 2], ['double', 2],
        ['fiveplex', 5], ['5-plex', 5], ['5 unit', 5], ['five unit', 5],
        ['6-plex', 6], ['sixplex', 6], ['6 unit', 6], ['six unit', 6],
        ['8-plex', 8], ['8 unit', 8], ['eight unit', 8],
        ['multi-family', null], ['multifamily', null], ['multi family', null],
      ];
      for(const [kw, n] of mfPatterns){
        if(desc.includes(kw)){
          if(n != null) detectedUnits = n;
          r.propertyType = r.propertyType || 'multifamily';
          break;
        }
      }
      if(detectedUnits == null && r.units > 1) detectedUnits = r.units;
      if(detectedUnits != null && r.units == null) r.units = detectedUnits;

      if(detectedUnits && !r.unitLayouts.length){
        // Scan for every "<N> bed / <N> bath" mention in the text, each with
        // a quantity word/number looked up in the ~40 chars right before it
        // ("two 2 bed 1 bath units", "a 3bd/2ba unit", "3BR/2BA owner's unit").
        const numWords = {one:1,two:2,three:3,four:4,five:5,six:6,a:1,an:1,the:1};
        const bbRe = /(\d)\s*(?:bed(?:room)?s?|bd|br)\s*[\/\-,&]?\s*(?:and\s*)?(\d(?:\.\d)?)\s*(?:bath(?:room)?s?|ba)\b/gi;
        const groups = [];
        let bm;
        while((bm = bbRe.exec(desc)) !== null){
          const before = desc.slice(Math.max(0, bm.index-40), bm.index);
          const qm = before.match(/(\d+|one|two|three|four|five|six|a|an|the)\s*[\w\s]{0,12}$/i);
          let count = 1;
          if(qm){
            const w = qm[1].toLowerCase();
            count = numWords[w] ?? (+w || 1);
          }
          groups.push({beds:+bm[1], baths:+bm[2], count});
        }
        const groupTotal = groups.reduce((s,g)=>s+g.count, 0);
        if(groups.length && groupTotal === detectedUnits){
          // Mixed (or uniform) composition found and it adds up to the known
          // unit count — trust it. Explode to one row per physical unit.
          r.unitLayouts = explodeUnitGroups(groups);
        } else if(r.beds != null && r.baths != null && detectedUnits > 0){
          // No reliable text breakdown (or it didn't add up) — fall back to
          // dividing the known totals evenly, one row per unit.
          const b = Math.round(r.beds / detectedUnits) || null;
          const ba = Math.round((r.baths / detectedUnits) * 2) / 2 || null;
          r.unitLayouts = explodeUnitGroups([{beds:b, baths:ba, count:detectedUnits}]);
          r._unitLayoutEvenSplit = true; // flag: this is a guess, not parsed from text
        }
      }
    }

    // City normalization
    if(r.city){
      const c = r.city.toLowerCase();
      if(c.includes('mesa')) r.city = 'Mesa';
      else if(c.includes('tempe')) r.city = 'Tempe';
      else if(c.includes('phoenix')) r.city = 'Phoenix';
    }

    // Deduplicate (no cap — a listing can have 70+ photos and she wants all of them).
    r.imageUrls = dedupePhotoUrls(r.imageUrls);
    return r;
  }

  // NOTE: There is deliberately no automated Zillow page-fetch function here.
  // Zillow's terms prohibit automated/bot access to the site. The "粘贴页面源码"
  // tab covers this legitimately instead: you manually view-source/copy a page
  // you're already looking at, and parseZillowHtml() below just parses that text
  // locally — no network request to Zillow is ever made by this app.

  async function rentcastGet(path, key){
    const res = await fetch('https://api.rentcast.io' + path, { headers: { 'X-Api-Key': key, 'Accept': 'application/json' } });
    if(!res.ok) throw new Error('RentCast ' + path + ' -> HTTP ' + res.status);
    return res.json();
  }

  async function fetchRentCastData(street, city, zip, key){
    const addressQuery = encodeURIComponent(`${street}, ${city}, AZ${zip ? ' ' + zip : ''}`);
    const out = { street, city, zip, price:null, beds:null, baths:null, sqft:null, rent:null, comps:[] };

    try{
      const props = await rentcastGet(`/v1/properties?address=${addressQuery}`, key);
      const rec = Array.isArray(props) ? props[0] : props;
      if(rec){
        out.beds = rec.bedrooms ?? out.beds;
        out.baths = rec.bathrooms ?? out.baths;
        out.sqft = rec.squareFootage ?? out.sqft;
        out.price = rec.lastSalePrice ?? out.price;
      }
    }catch(e){ console.error('RentCast properties lookup failed', e); }

    try{
      const listings = await rentcastGet(`/v1/listings/sale?address=${addressQuery}`, key);
      const listing = Array.isArray(listings) ? listings[0] : listings;
      if(listing && listing.price) out.price = listing.price;
    }catch(e){ console.error('RentCast sale listing lookup failed', e); }

    try{
      const avm = await rentcastGet(`/v1/avm/rent/long-term?address=${addressQuery}`, key);
      if(avm){
        out.rent = avm.rent ?? avm.rentEstimate ?? null;
        const comparables = avm.comparables || avm.comps || [];
        out.comps = comparables.map(c => c.price ?? c.rent).filter(v => typeof v === 'number').slice(0, 5);
      }
    }catch(e){ console.error('RentCast rent AVM lookup failed', e); }

    return out;
  }

  function estimateZoriRent(zip, propType, beds, baths){
    const base = ZORI_BASELINE[zip];
    if(!base) return null;
    let rent = base;
    const bedKey = Math.min(4, Math.max(1, Math.round(beds) || 2));
    const mult = getBedMult(zip, propType);
    rent *= mult[bedKey] || mult[2];
    const extraBaths = Math.max(0, (baths || 1) - 1);
    rent *= (1 + extraBaths * ZORI_BATH_ADJUST_PER_EXTRA);
    return Math.round(rent);
  }

  // Per-unit rent estimate for multifamily — always uses apartment multipliers.
  function estimateUnitRent(zip, beds, baths){
    const base = ZORI_BASELINE[zip];
    if(!base) return null;
    let rent = base;
    const bedKey = Math.min(4, Math.max(1, Math.round(beds) || 2));
    const mult = getBedMult(zip, 'apartment');
    rent *= mult[bedKey] || mult[2];
    const extraBaths = Math.max(0, (baths || 1) - 1);
    rent *= (1 + extraBaths * ZORI_BATH_ADJUST_PER_EXTRA);
    return Math.round(rent);
  }

  // Reads the unit-layout rows straight from the DOM — no closure dependency,
  // so it's usable both from openForm()'s handlers and from applyZoriFallback()
  // below (which lives outside openForm()'s scope).
  function getFormUnitLayouts(){
    const rows = document.querySelectorAll('#unit-layout-rows .unit-layout-row');
    const layouts = [];
    rows.forEach(r=>{
      const beds = +(r.querySelector('.ul-beds')?.value) || 0;
      const baths = +(r.querySelector('.ul-baths')?.value) || 0;
      const count = +(r.querySelector('.ul-count')?.value) || 0;
      const pct = +(r.querySelector('.ul-pct')?.value) || 0;
      const actualRent = +(r.querySelector('.ul-actual-rent')?.value) || 0;
      if(count > 0 && (beds > 0 || baths > 0)){
        layouts.push({beds, baths, count, rentAdjustPct: pct, actualRent});
      }
    });
    return layouts;
  }

  function applyZoriFallback(zip){
    const propType = $('f-proptype') ? $('f-proptype').value : 'house';
    // For multifamily with unit layouts, do per-unit estimation
    const unitLayouts = getFormUnitLayouts();
    if(unitLayouts.length && ($('f-units').value|0) > 1){
      let total = 0;
      for(const lu of unitLayouts){
        const uRent = estimateUnitRent(zip, lu.beds||2, lu.baths||1);
        if(uRent) total += uRent * (lu.count||1);
      }
      if(total){
        $('f-manual-rent').value = total;
        return true;
      }
    }
    const beds = +$('f-beds').value || 2;
    const baths = +$('f-baths').value || 1;
    const rent = estimateZoriRent(zip, propType, beds, baths);
    if(!rent) return false;
    $('f-manual-rent').value = rent;
    return true;
  }

  // ---------- Maricopa County Assessor lookup ----------
  function assessorSearchUrl(street, city){
    return `https://mcassessor.maricopa.gov/mcs/?q=${encodeURIComponent(street + ' ' + city)}`;
  }

  // Tax rate estimates based on Ownwell effective rate data (tax ÷ FCV).
  // These are median effective rates; actual tax varies by school district,
  // special districts, and exemptions within each city.
  // Sources: Chandler AZ FY25-26 Tax Rate Comparison PDF; Ownwell Maricopa trends.
  const JURISDICTION_TAX_RATES = {
    MESA:     { pctOfFCV: 0.44, label: 'Mesa 中位' },
    PHOENIX:  { pctOfFCV: 0.46, label: 'Phoenix 中位' },
    TEMPE:    { pctOfFCV: 0.53, label: 'Tempe 中位' },
    SCOTTSDALE: { pctOfFCV: 0.37, label: 'Scottsdale 中位' },
    CHANDLER: { pctOfFCV: 0.47, label: 'Chandler 中位' },
    GILBERT:  { pctOfFCV: 0.46, label: 'Gilbert 中位' },
    GLENDALE: { pctOfFCV: 0.43, label: 'Glendale 中位' },
  };

  // Fallback rate for unknown jurisdictions in Maricopa County.
  const MARICOPA_DEFAULT_TAX_RATE = 0.46; // pct of FCV

  // JSONP-based ArcGIS parcel query. Returns { fcv, lpv, jurisdiction, apn, taxEstimate }
  // Uses JSONP (<script> injection) so it works from any local HTML file with no CORS proxy.
  async function queryArcGISAssessor(street, city){
    return new Promise((resolve, reject) => {
      const cbName = '_arcgis_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
      const timeout = setTimeout(() => {
        delete window[cbName];
        const s = document.getElementById(cbName);
        if(s) s.remove();
        reject(new Error('ArcGIS query timed out'));
      }, 12000);

      window[cbName] = function(data){
        clearTimeout(timeout);
        delete window[cbName];
        const s = document.getElementById(cbName);
        if(s) s.remove();

        if(!data || !data.features || !data.features.length){
          reject(new Error('ArcGIS: no parcel found for this address'));
          return;
        }
        const a = data.features[0].attributes;
        const fcv = parseInt((a.FCV_CUR || '').replace(/[, ]/g,'')) || 0;
        const lpv = parseInt((a.LPV_CUR || '').replace(/[, ]/g,'')) || 0;
        const jur = (a.JURISDICTION || '').trim().toUpperCase();
        const apn = (a.APN || '').trim();
        const rateInfo = JURISDICTION_TAX_RATES[jur] || null;
        const ratePct = rateInfo ? rateInfo.pctOfFCV : MARICOPA_DEFAULT_TAX_RATE;
        const taxEstimate = Math.round(fcv * ratePct / 100);
        resolve({
          fcv, lpv, jurisdiction: a.JURISDICTION || '', apn,
          taxEstimate,
          rateUsed: ratePct,
          rateLabel: rateInfo ? rateInfo.label : `Maricopa 默认 ${ratePct}%`,
        });
      };

      const where = encodeURIComponent(
        "UPPER(PHYSICAL_ADDRESS) LIKE UPPER('%" +
        street.toUpperCase().replace(/'/g,"''") + "%" +
        city.toUpperCase().replace(/'/g,"''") + "%')"
      );
      const script = document.createElement('script');
      script.id = cbName;
      script.src = 'https://gis.mcassessor.maricopa.gov/arcgis/rest/services/MaricopaDynamicQueryService/MapServer/3/query'
        + '?where=' + where
        + '&outFields=APN,LPV_CUR,FCV_CUR,JURISDICTION,PHYSICAL_ADDRESS'
        + '&returnGeometry=false&f=json&callback=' + cbName;
      script.onerror = function(){
        clearTimeout(timeout);
        delete window[cbName];
        reject(new Error('ArcGIS: network error'));
      };
      document.head.appendChild(script);
    });
  }

  // ---------- calculations ----------
  function calcPITI(p){
    const loan = p.price * (1 - p.down/100);
    const r = p.rate/100/12;
    const n = p.term*12;
    let pi;
    if(r === 0) pi = loan/n;
    else pi = loan * r / (1 - Math.pow(1+r, -n));
    const taxBase = p.assessedValue || p.price;
    const tax = p.taxAnnual ? p.taxAnnual / 12 : taxBase * p.tax/100 / 12;
    const ins = p.price * p.ins/100 / 12;
    const hoa = p.hoa || 0;
    return {pi, tax, ins, hoa, total: pi+tax+ins+hoa};
  }

  // Multi-family: per-unit-layout rent estimation using ZORI lookup table.
  // Each unit layout gets its own base rent (ZIP × bed multiplier), own adjustment
  // percentage, then total = sum(count × adjusted rent per layout).
  // SFH or multifamily without layouts: falls back to comp average × unit count.
  function estimateRent(p){
    const unitLayouts = (p.unitLayouts && p.unitLayouts.length) ? p.unitLayouts : [];
    const isMf = p.propertyType === 'multifamily' || ((p.units||1) > 1);

    if(isMf && unitLayouts.length){
      const zip = p.zip || '';
      const details = [];
      let totalRent = 0, totalBaseRent = 0;
      for(const lu of unitLayouts){
        const count = lu.count || 1;
        const hasActual = lu.actualRent > 0;
        // A real, current rent (existing tenant) beats the ZIP/bed-count model
        // outright — no point estimating what's already known. Model estimate
        // still shown alongside for reference/comparison.
        const perUnitBase = estimateUnitRent(zip, lu.beds||2, lu.baths||1) || 0;
        const adjustPct = lu.rentAdjustPct ?? p.rentAdjustPct ?? 0;
        const perUnitAdj = hasActual ? lu.actualRent : Math.round(perUnitBase * (1 + adjustPct/100));
        details.push({
          beds: lu.beds, baths: lu.baths, count,
          perUnitBase, perUnitAdj, adjustPct, hasActual,
          groupTotal: perUnitAdj * count
        });
        totalBaseRent += perUnitBase * count;
        totalRent += perUnitAdj * count;
      }
      // If comps also exist, blend: ZORI 60% / comps 40%
      const comps = (p.comps||[]).filter(c=>c>0);
      if(comps.length){
        const compAvg = comps.reduce((a,b)=>a+b,0)/comps.length;
        const compTotal = compAvg * (p.units||1);
        totalRent = Math.round(totalRent * 0.6 + compTotal * 0.4);
      }
      return {
        base: totalBaseRent, adj: totalRent, units: p.units||1, total: totalRent,
        unitDetails: details, isPerUnit: true
      };
    }

    // SFH or simple multifamily fallback
    const comps = (p.comps||[]).filter(c=>c>0);
    const base = comps.length ? comps.reduce((a,b)=>a+b,0)/comps.length : (p.manualRent||0);
    const adj = base * (1 + (p.rentAdjustPct||0)/100);
    const units = p.units || 1;
    const total = adj * units;
    return {base, adj, units, total, isPerUnit: false};
  }

  // ---------- render list ----------
  function dayLabel(ts){
    const d = new Date(ts);
    const today = new Date();
    const yest = new Date(); yest.setDate(today.getDate()-1);
    const sameDay = (a,b)=>a.toDateString()===b.toDateString();
    if(sameDay(d, today)) return '今天 · ' + d.toLocaleDateString('zh-CN');
    if(sameDay(d, yest)) return '昨天 · ' + d.toLocaleDateString('zh-CN');
    return d.toLocaleDateString('zh-CN', {year:'numeric', month:'long', day:'numeric', weekday:'long'});
  }
  function render(){
    const list = $('list');
    list.innerHTML = '';
    $('empty-state').style.display = properties.length ? 'none':'block';
    let lastDay = null;
    properties.slice().sort((a,b)=>b.createdAt-a.createdAt).forEach(p=>{
      const day = new Date(p.createdAt).toDateString();
      if(day !== lastDay){
        lastDay = day;
        const header = document.createElement('div');
        header.className = 'date-header';
        header.textContent = dayLabel(p.createdAt);
        list.appendChild(header);
      }
      list.appendChild(renderCard(p));
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------- AI photo analysis ----------
  const AI_CONDITION_PROMPT = '你在评估一套出租投资房的室内/外观照片，用于估算合理租金水平。请只返回一个JSON对象，不要有任何其他文字、不要markdown代码块，格式严格为：{"tier":"old"|"updated"|"new","reason":"一句中文说明，20字以内","suggested_adjust_pct":数字}。tier含义：old=明显老旧未翻新，updated=状态一般或部分翻新，new=近期全新装修/地板家具新净。suggested_adjust_pct是相对市场均价租金的建议调整百分比，old约-10到-3，updated约-2到3，new约8到18。';

  function extractJson(text){
    const clean = text.replace(/```json|```/g,'').trim();
    return JSON.parse(clean);
  }

  async function callGeminiVision(base64, mediaType, key){
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${key}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        contents:[{ parts:[
          {text: AI_CONDITION_PROMPT},
          {inline_data:{mime_type:mediaType, data:base64}}
        ]}]
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!text) throw new Error('no text in response');
    return extractJson(text);
  }

  async function callAnthropicVision(base64, mediaType, key){
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:400,
        messages:[{
          role:'user',
          content:[
            {type:'image', source:{type:'base64', media_type:mediaType, data:base64}},
            {type:'text', text: AI_CONDITION_PROMPT}
          ]
        }]
      })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data?.error?.message || `HTTP ${res.status}`);
    const textBlock = (data.content||[]).find(b=>b.type==='text');
    if(!textBlock) throw new Error('no text in response');
    return extractJson(textBlock.text);
  }

  // NOTE: There is deliberately no batch/automated photo-analysis function here.
  // Earlier versions of this file fetched extracted Zillow photo URLs (via CORS
  // proxy for Gemini, or directly for Anthropic's URL-based image input) — that's
  // still automated, at-scale access to Zillow's CDN, so it's removed. Photos
  // extracted from a manually-pasted page source are shown inline (a plain <img
  // src>, same as any embedded web image) — analysis stays manual: download a
  // photo yourself and upload it below.

  async function handleAIAnalyze(e, p, card){
    const file = e.target.files[0];
    if(!file) return;
    const resultBox = card.querySelector('.ai-result');
    const geminiKey = assumptions.geminiKey;
    const anthropicKey = assumptions.anthropicKey;
    if(!geminiKey && !anthropicKey){
      resultBox.innerHTML = `<div class="ai-box" style="border-color:var(--reject);"><span class="verdict" style="color:var(--reject);">未配置 API Key</span><p>请先在上方"默认假设参数"里填写 Google Gemini API Key（免费，见 aistudio.google.com）或 Anthropic API Key（付费）。</p></div>`;
      e.target.value = '';
      return;
    }
    resultBox.innerHTML = `<div class="ai-box"><span class="spinner"></span>正在分析装修状况…</div>`;
    let thumbHtml = '';

    try{
      const base64 = await fileToBase64(file);
      const mediaType = file.type || 'image/jpeg';
      thumbHtml = `<img class="thumb" src="data:${mediaType};base64,${base64}">`;
      resultBox.innerHTML = thumbHtml + `<div class="ai-box"><span class="spinner"></span>正在分析装修状况…</div>`;

      const parsed = geminiKey
        ? await callGeminiVision(base64, mediaType, geminiKey)
        : await callAnthropicVision(base64, mediaType, anthropicKey);

      const tierLabel = {old:'老旧', updated:'一般/翻新中', new:'全新装修'}[parsed.tier] || parsed.tier;
      resultBox.innerHTML = thumbHtml + `
        <div class="ai-box">
          <span class="verdict">AI 判断：${tierLabel}（建议租金调整 ${parsed.suggested_adjust_pct>0?'+':''}${parsed.suggested_adjust_pct}%）</span>

        </div>`;
      resultBox.querySelector('.btn-apply-ai').addEventListener('click', ()=>{

        toast('已应用 AI 建议');
      });
    }catch(err){
      console.error(err);
      resultBox.innerHTML = thumbHtml + `<div class="ai-box" style="border-color:var(--reject);"><span class="verdict" style="color:var(--reject);">分析失败</span><p>${escapeHtml(err.message || '请重试，或手动在上方选择装修档位。')}</p></div>`;
    }
  }
  function fileToBase64(file){
    return new Promise((resolve, reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result.split(',')[1]);
      r.onerror = ()=> reject(new Error('read failed'));
      r.readAsDataURL(file);
    });
  }

      // Re-validate and recompute reference rent on any input change
      row.querySelectorAll('input').forEach(inp=>{

    // Live per-unit reference rent (ZIP baseline × bed/bath model, same logic
    // estimateRent() uses to compute the saved card) — shown while editing,
    // not just after saving, and with no button to click: it just recomputes
    // on every relevant input change.
    function refreshUnitLayoutRents(){
      const zip = $('f-zip').value.trim();
      const rows = document.querySelectorAll('#unit-layout-rows .unit-layout-row');
      let grandTotal = 0, anyRent = false;
      rows.forEach(row=>{
        const beds = +(row.querySelector('.ul-beds')?.value) || 0;
        const baths = +(row.querySelector('.ul-baths')?.value) || 0;
        const count = +(row.querySelector('.ul-count')?.value) || 0;
        const pct = +(row.querySelector('.ul-pct')?.value) || 0;
        const actualRent = +(row.querySelector('.ul-actual-rent')?.value) || 0;
        const preview = row.querySelector('.ul-rent-preview');
        if(!preview) return;
        if(!count || (!beds && !baths)){ preview.textContent = ''; return; }
        const base = estimateUnitRent(zip, beds||2, baths||1);
        if(base == null){ preview.textContent = zip ? '无 ZIP 参考数据' : '请先填邮编'; return; }
        const hasActual = actualRent > 0;
        const perUnit = hasActual ? actualRent : Math.round(base * (1 + pct/100));
        const rowTotal = perUnit * count;
        grandTotal += rowTotal;
        anyRent = true;
        preview.innerHTML = hasActual
          ? `<span style="color:var(--approve); font-weight:700;">实际</span> ${fmt(perUnit)}/户 → ${fmt(rowTotal)}`
          : `参考 ${fmt(perUnit)}/户 → ${fmt(rowTotal)}`;
      });
      const totalEl = $('unit-layout-rent-total');
      if(totalEl) totalEl.textContent = anyRent ? `合计参考租金：${fmt(grandTotal)}/mo` : '';
    }
    // Live SFH reference rent hint (ZORI model) — auto-fills the manual-rent

      if((+$('f-units').value || 1) > 1) return; // multi-unit uses the per-row breakdown instead

      const proptype = $('f-proptype').value;
      const beds = +$('f-beds').value || 2;
      const baths = +$('f-baths').value || 1;

      if(!hint) return;
      const ref = zip ? estimateZoriRent(zip, proptype, beds, baths) : null;
      if(ref == null){ hint.textContent = zip ? `邮编 ${zip} 无 ZORI 参考数据` : ''; return; }
      hint.textContent = `参考（ZORI 模型，截至 ${ZORI_ASOF}）：${fmt(ref)}/mo`;
      if(!manualRentUserEdited) $('f-manual-rent').value = ref;

      const layouts = getFormUnitLayouts();

      const totalBaths = +$('f-baths').value || 0;
      const totalUnits = +$('f-units').value || 1;
      const sumBeds = layouts.reduce((s,l)=>s+(l.beds||0)*(l.count||0),0);
      const sumBaths = layouts.reduce((s,l)=>s+(l.baths||0)*(l.count||0),0);
      const sumUnits = layouts.reduce((s,l)=>s+(l.count||0),0);
      const v = $('unit-layout-validation');
      if(!layouts.length){
        v.className = 'unit-validation';
        v.textContent = '';
        return;
      }
      const msgs = [];
      if(totalBeds && sumBeds !== totalBeds) msgs.push(`bed: 户型合计 ${sumBeds} ≠ 总填写 ${totalBeds}`);
      if(totalBaths && sumBaths !== totalBaths) msgs.push(`bath: 户型合计 ${sumBaths} ≠ 总填写 ${totalBaths}`);
      if(sumUnits !== totalUnits) msgs.push(`户数: 户型合计 ${sumUnits} ≠ Units ${totalUnits}`);
      if(msgs.length){
        v.className = 'unit-validation mismatch';
        v.textContent = '⚠ ' + msgs.join(' | ');
      } else {
        v.className = 'unit-validation match';
        v.textContent = '✓ 户型 bed/bath/户数 验算通过';
      }
    }
    function showUnitLayoutEditor(){
      $('unit-layout-section').style.display = 'block';
      $('unit-layout-rows').innerHTML = '';
      // Populate from existing unitLayouts, or auto-suggest from the live form
      // fields (not the stale initial `p` object — matters for new properties
      // where the user just typed beds/baths/units into the form).
      const layouts = (p.unitLayouts && p.unitLayouts.length) ? p.unitLayouts : [];
      const liveUnits = +$('f-units').value || p.units || 1;
      const liveBeds = +$('f-beds').value || p.beds || 0;
      const liveBaths = +$('f-baths').value || p.baths || 0;
      if(!layouts.length && liveUnits > 1){
        // Auto-suggest: divide total beds/baths evenly, one row per unit
        // (not one grouped row) — each unit gets its own adjustable row.
        const b = liveBeds > 0 ? Math.round(liveBeds/liveUnits) : 2;
        const ba = liveBaths > 0 ? Math.round(liveBaths/liveUnits) : 1;
        for(let i=0;i<liveUnits;i++) addUnitLayoutRow(b, ba, 1, 0);
      } else if(layouts.length){
        layouts.forEach(lu=>addUnitLayoutRow(lu.beds, lu.baths, lu.count, lu.rentAdjustPct||0, lu.actualRent||0));
      }

      if(!layouts.length && liveUnits <= 1){
        addUnitLayoutRow(liveBeds||2, liveBaths||1, 1, 0);
      }
      validateUnitLayouts();
    }
    $('btn-add-unit-layout').addEventListener('click', ()=>addUnitLayoutRow(null,null,1,0));
    // Show/hide unit layout editor based on units field

    // otherwise every beds/baths keystroke would lock in a stale auto-fill

    let manualRentUserEdited = false;

    if(!existing){

      function fillFromParsed(data, statusBox, statusPrefix){
        if(data.address) $('f-address').value = data.address;
        if(data.city) $('f-city').value = data.city;
        if(data.zip) $('f-zip').value = data.zip;
        if(data.price != null) $('f-price').value = data.price;
        if(data.beds != null) $('f-beds').value = data.beds;
        if(data.baths != null) $('f-baths').value = data.baths;
        if(data.sqft != null) $('f-sqft').value = data.sqft;
        if(data.units != null) $('f-units').value = data.units;
        if(data.taxAnnual != null) $('f-tax-annual').value = data.taxAnnual;
        if(data.taxAssessed != null) $('f-assessed-value').value = data.taxAssessed;
        if(data.description) $('f-notes').value = (data.description || '').slice(0, 500);
        // Unit layouts (multifamily)
        if(data.unitLayouts && data.unitLayouts.length && data.units > 1){
          $('unit-layout-rows').innerHTML = '';
          data.unitLayouts.forEach(lu => addUnitLayoutRow(lu.beds, lu.baths, lu.count, lu.rentAdjustPct||0, lu.actualRent||0));
          $('unit-layout-section').style.display = 'block';
          validateUnitLayouts();
        }
        // Property type
        if(data.propertyType && data.propertyType === 'multifamily'){
          // Could store for later save
        }
        // Rents
        if(data.unitRents && data.unitRents.length){
          compRows.innerHTML = '';
          data.unitRents.forEach(r => addCompRow(r));
        } else if(data.totalRent){
          $('f-manual-rent').value = Math.round(data.totalRent);
        } else if(data.rentZestimate){
          $('f-manual-rent').value = Math.round(data.rentZestimate);
        }
        // Images
        pendingImageUrls = data.imageUrls || [];
        if(pendingImageUrls.length){
          const preview = $('zillow-images-preview');
          if(preview){
            preview.innerHTML = pendingImageUrls.map(u =>
              `<img src="${escapeHtml(u)}" loading="lazy" onerror="this.style.display='none'">`
            ).join('');
          }
        }
        // Status summary
        const parts = [statusPrefix];
        if(data.price != null) parts.push(`售价 $${data.price.toLocaleString()}`);
        if(data.beds != null) parts.push(`${data.beds}bd/${data.baths}ba`);
        if(data.sqft != null) parts.push(`${data.sqft} sqft`);
        if(data.units != null && data.units > 1) parts.push(`${data.units} units`);
        if(data.taxAnnual != null) parts.push(`年地税 $${data.taxAnnual.toLocaleString()}`);
        if(data.totalRent) parts.push(`总租金 $${data.totalRent.toLocaleString()}/mo`);
        if(pendingImageUrls.length) parts.push(`${pendingImageUrls.length} 张照片`);
        statusBox.innerHTML = parts.join(' · ');
        // zip/beds/baths were just set programmatically above (no 'input'
        // event fires for that), so the live reference-rent hints need an
        // explicit refresh here rather than relying on field listeners.
        refreshSfhRentRef();
        refreshUnitLayoutRents();
      }

      // Auto-fetch property tax from Maricopa County ArcGIS when Zillow didn't have it.
      // Callers must `await` this — it used to be fired without awaiting, so
      // clicking 保存 before the ~1-3s round-trip finished meant f-tax-annual
      // was still empty and the ArcGIS result never made it into the saved
      // property at all.
      async function autoFetchTaxFromArcGIS(statusEl){
        if($('f-tax-annual').value) return true; // Already have tax data
        const street = $('f-address').value.trim();
        const city = $('f-city').value;
        if(!street || !city) return false;
        const marker = document.createElement('span');
        marker.style.color = 'var(--slate)';
        marker.textContent = ' · 🔎 查询地税中…';
        if(statusEl) statusEl.appendChild(marker);
        try{
          const result = await queryArcGISAssessor(street, city);
          $('f-tax-annual').value = result.taxEstimate;
          $('f-assessed-value').value = result.lpv;
          const info = `ArcGIS 自动查询: APN ${result.apn}, LPV $${result.lpv.toLocaleString()}, ${result.rateLabel} → 年税 $${result.taxEstimate.toLocaleString()}`;
          $('assessor-status').dataset.info = info;
          $('assessor-status').textContent = `已从 ArcGIS 查到 LPV $${result.lpv.toLocaleString()} (APN ${result.apn})，估算年税 ≈ $${result.taxEstimate.toLocaleString()}`;
          const taxRetryStatus = $('tax-retry-status');
          if(taxRetryStatus) taxRetryStatus.innerHTML = `<span style="color:var(--approve);">✅ 自动查税成功：$${result.taxEstimate.toLocaleString()}/年（${result.rateLabel}）</span>`;
          marker.style.color = 'var(--accent)';
          marker.textContent = ` · 地税 $${result.taxEstimate.toLocaleString()}/年（ArcGIS 自动估算，${result.rateLabel}）`;
          return true;
        }catch(e){
          console.warn('ArcGIS tax auto-fetch failed:', e.message);
          marker.style.color = 'var(--reject)';
          marker.textContent = ` · 地税自动查询失败：${e.message}`;
          const taxRetryStatus = $('tax-retry-status');
          if(taxRetryStatus) taxRetryStatus.innerHTML = `<span style="color:var(--reject);">⚠️ 自动查税失败，请手动填入或点「🔍 自动查税」重试</span>`;
          return false;
        }
      }

      // URL handler — parses the address out of the link text (no fetch to Zillow),
      // then uses RentCast (licensed data) or the ZORI model. Full data + photos
      // require the "粘贴页面源码" tab (you paste text you copied yourself — never
      // an automated fetch of Zillow's site).
      $('btn-do-zillow').addEventListener('click', async ()=>{
        const url = $('f-zillow-url').value.trim();
        const statusBox = $('zillow-status');
        if(!url){ statusBox.textContent = '请粘贴 Zillow 链接'; return; }
        statusBox.innerHTML = `<span class="spinner"></span>正在处理…`;
        const key = assumptions.rentcastKey;
        const parsed = parseZillowAddress(url);
        if(!parsed){ statusBox.innerHTML = '无法解析地址，请改用"粘贴页面源码"方式<br><span style="color:var(--accent);">💡 在 Zillow 页面按 Ctrl+U 复制源码粘贴即可</span>'; return; }
        $('f-address').value = parsed.street;
        $('f-city').value = parsed.city;
        if(parsed.zip) $('f-zip').value = parsed.zip;
        let data = { price:null, beds:null, baths:null, sqft:null, rent:null, comps:[] };
        if(key){
          try{ data = await fetchRentCastData(parsed.street, parsed.city, parsed.zip, key); }
          catch(e){ console.error(e); }
        }
        if(data.price) $('f-price').value = data.price;
        if(data.beds!=null) $('f-beds').value = data.beds;
        if(data.baths!=null) $('f-baths').value = data.baths;
        if(data.sqft!=null) $('f-sqft').value = data.sqft;
        if(data.comps.length){
          compRows.innerHTML = '';
          data.comps.forEach(addCompRow);
        } else if(data.rent){
          $('f-manual-rent').value = data.rent;
        } else {
          applyZoriFallback(parsed.zip);
        }
        const missing = [];
        if(!data.price) missing.push('售价');
        if(data.beds==null) missing.push('bed/bath/sqft');
        statusBox.innerHTML = (key
          ? (missing.length ? `已从 RentCast 填充，仍缺：${missing.join('、')}` : '已从 RentCast 填充，请核对')
          : '未配置 RentCast Key，售价/户型需手动填写；租金已用免费模型估算')
          + `<br><span style="color:var(--accent);">💡 想要售价、真实户型、照片？在 Zillow 页面按 Ctrl+U 复制源码，粘贴到"页面源码"标签可提取全部信息</span>`;
        refreshSfhRentRef();
        refreshUnitLayoutRents();
        await autoFetchTaxFromArcGIS(statusBox);
      });

      // HTML source handler — the main new feature
      $('btn-do-zillow-html').addEventListener('click', async ()=>{
        const html = $('f-zillow-html').value.trim();
        const statusBox = $('zillow-html-status');
        if(!html || html.length < 200){ statusBox.textContent = '请粘贴完整的页面源码（至少几百字符）'; return; }
        statusBox.innerHTML = `<span class="spinner"></span>正在解析…`;
        try{
          const data = parseZillowHtml(html);
          if(!data.address && !data.price && !data.imageUrls.length){
            statusBox.innerHTML = '<span style="color:var(--reject);">未提取到有效数据，请确认粘贴的是 Zillow 房源页面的完整源码</span>';
            return;
          }
          fillFromParsed(data, statusBox, '✅ 解析完成');
          // If no rent data, try ZORI fallback
          if(!data.totalRent && !data.rentZestimate && !data.unitRents.length){
            const zip = data.zip || $('f-zip').value.trim();
            if(zip) applyZoriFallback(zip);
          }
          // Auto-fetch tax from ArcGIS if Zillow didn't have it
          await autoFetchTaxFromArcGIS(statusBox);
          refreshUnitLayoutRents();
        }catch(e){
          console.error(e);
          statusBox.innerHTML = `<span style="color:var(--reject);">解析失败：${escapeHtml(e.message)}</span>`;
        }
      });

      $('btn-toggle-import').addEventListener('click', ()=>{
        const box = $('import-slot');
        box.style.display = box.style.display==='none' ? 'block' : 'none';
      });
      $('btn-do-import').addEventListener('click', ()=>{
        let obj;
        try{ obj = JSON.parse($('f-import').value); }
        catch(e){ toast('JSON 格式解析失败，检查一下有没有多余的逗号或引号'); return; }
        if(obj.address) $('f-address').value = obj.address;
        if(obj.city) $('f-city').value = obj.city;
        if(obj.price) $('f-price').value = obj.price;
        if(obj.beds!=null) $('f-beds').value = obj.beds;
        if(obj.baths!=null) $('f-baths').value = obj.baths;
        if(obj.sqft!=null) $('f-sqft').value = obj.sqft;
        if(obj.units!=null) $('f-units').value = obj.units;
        if(obj.notes) $('f-notes').value = obj.notes;
        if(Array.isArray(obj.comps) && obj.comps.length){
          compRows.innerHTML = '';
          obj.comps.forEach(addCompRow);
        }
        toast('已填充，检查一下再保存');
      });
    }

    $('btn-save').addEventListener('click', ()=>{
      const comps = Array.from(compRows.querySelectorAll('input')).map(i=>+i.value).filter(v=>v>0);
      const unitLayouts = getFormUnitLayouts();
      // Auto-detect propertyType from units + layouts
      const propTypeField = $('f-proptype').value;
      const units = +$('f-units').value||1;
      let propertyType = 'single_family';
      if(unitLayouts.length && units > 1) propertyType = 'multifamily';
      else if(units > 1) propertyType = 'multifamily';

      const np = {
        id:p.id, createdAt:p.createdAt,
        address:$('f-address').value.trim(), city:$('f-city').value, zip:$('f-zip').value.trim(),
        propType:propTypeField, propertyType,
        homeType:p.homeType || (propertyType === 'multifamily' ? 'multifamily' : 'single_family'),
        assessedValue:+$('f-assessed-value').value||0,
        assessorInfo:$('assessor-status').dataset.info || (p.assessorInfo||''),
        price:+$('f-price').value, down:+$('f-down').value, rate:+$('f-rate').value,
        term:+$('f-term').value, tax:+$('f-tax').value, ins:+$('f-ins').value, hoa:+$('f-hoa').value,
        beds:$('f-beds').value?+$('f-beds').value:'', baths:$('f-baths').value?+$('f-baths').value:'',
        sqft:$('f-sqft').value?+$('f-sqft').value:'', units,
        notes:$('f-notes').value.trim(),
        comps, manualRent:+$('f-manual-rent').value,
        tier:p.tier||'updated', rentAdjustPct:p.rentAdjustPct||0,
        taxAnnual:+$('f-tax-annual').value||null,
        imageUrls:pendingImageUrls,
        aiAnalyzed:p.aiAnalyzed||false, aiReason:p.aiReason||'',
        unitLayouts, rentZestimate:p.rentZestimate, unitRents:p.unitRents||[]
      };
      if(!np.address){ toast('请填写地址'); return; }
      const idx = properties.findIndex(x=>x.id===np.id);
      if(idx>=0) properties[idx]=np; else properties.push(np);
      saveProperties();
      // Carry forward financial params as defaults for the next new property
      let changed = false;
      if(np.down && np.down !== assumptions.down){ assumptions = {...assumptions, down:np.down}; changed=true; }
      if(np.rate && np.rate !== assumptions.rate){ assumptions = {...assumptions, rate:np.rate}; changed=true; }
      if(np.term && np.term !== assumptions.term){ assumptions = {...assumptions, term:np.term}; changed=true; }
      if(np.tax && np.tax !== assumptions.tax){ assumptions = {...assumptions, tax:np.tax}; changed=true; }
      if(np.ins && np.ins !== assumptions.ins){ assumptions = {...assumptions, ins:np.ins}; changed=true; }
      if(np.hoa != null && np.hoa !== assumptions.hoa){ assumptions = {...assumptions, hoa:np.hoa}; changed=true; }
      if(changed){ saveAssumptions(); hydrateAssumptionFields(); }
      slot.innerHTML=''; editingId=null;
      render();
      toast('已保存');
    });
  }

  $('btn-add').addEventListener('click', ()=>openForm(null));

  $('btn-copy').addEventListener('click', ()=>{
    const passing = properties.filter(p=>{
      const piti = calcPITI(p); const rent = estimateRent(p);
      return rent.total*coverageRatio >= piti.total && rent.total>0;
    });
    if(!passing.length){ toast('目前没有达标房源'); return; }
    const lines = passing.map(p=>{
      const piti = calcPITI(p); const rent = estimateRent(p);
      const rentStr = rent.units>1 ? `${fmt(rent.adj)}/unit x${rent.units}=${fmt(rent.total)}` : fmt(rent.total);
      return `${p.address}, ${p.city} AZ | 售价 ${fmt(p.price)} | PITI ${fmt(piti.total)}/mo | 估算租金 ${rentStr}/mo | 剩余 ${fmt(rent.total*coverageRatio-piti.total)}/mo`;
    });
    const text = `达标投资房源（租金×${coverageRatio.toFixed(2)} ≥ PITI）\n\n` + lines.join('\n');
    navigator.clipboard.writeText(text).then(()=>toast('已复制到剪贴板，可粘贴发邮件')).catch(()=>toast('复制失败，请手动选取文本'));
  });

  loadAll();
})();
</script>
</body>
</html>
